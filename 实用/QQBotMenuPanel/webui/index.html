<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QQ 自定义菜单与指令面板</title>

    <!--
        文件结构
        1. PAGE_CONFIG：页面名称、业务事件名、请求超时、默认页签、预览区开关。
        2. CSS：先集中外观变量，再按“页面骨架 → 控件 → 预览区 → 窄屏”排列。
        3. HTML：顶部工具栏 → 左侧编辑区（五个页签）→ 右侧预览 → 两个弹窗。
        4. 脚本：常量状态 → 通信 → 渲染 → 编辑 → 平台操作 → 事件绑定 → 初始化。

        修改入口
        - 改标题、超时、默认页签、是否显示预览：只改 PAGE_CONFIG。
        - 改配色、宽度、圆角：只改 CSS 开头 :root 里的变量。
        - 改按钮行为：在脚本后半部分的 ACTION_HANDLERS 里按动作名查找。
        - 改按钮文案：直接改 body 中对应按钮的文字。
    -->
    <script>
        'use strict';

        // 页面级配置：复制本插件模板时优先修改这里。
        const PAGE_CONFIG = {
            // 必须与 webui.py 中处理的业务事件名一致。
            eventName: 'QQBotMenuPanel_WebUI',

            // 顶部标题与浏览器标题。
            title: 'QQ 自定义菜单与指令面板',

            // 与 OlivOS 宿主的单次请求等待时间（毫秒）。
            // 菜单与面板要访问 QQ 平台接口，耗时较长，不要设置得过小。
            requestTimeoutMs: 120000,

            // 首次打开显示的页签：menu / panel / browse / settings / help。
            defaultTab: 'menu',

            // 右侧预览区开关。关闭后编辑区占满整宽，其余功能不受影响。
            features: {
                preview: true,
            },
        };
    </script>

    <style>
        /* ==================== 1. 可调整的外观参数 ==================== */
        :root {
            /* 主题色（按钮、选中态、开关） */
            --blue: #2b8cff;
            --blue-soft: #e8f1ff;
            --switch: #5b8def;
            --switch-bg: #e7f0fe;
            --switch-border: #c5dcff;

            /* 文字与页面背景 */
            --text: #1f1f1f;
            --sub: #9aa0a6;
            --muted: #a8a8a8;
            --line: #f0f0f0;
            --bg: #f3f4f6;
            --card: #ffffff;

            /* 顶部工具栏 */
            --topbar-bg: #00a0ea;
            --topbar-text: #ffffff;

            /* 按钮 */
            --primary-button: #40c3ff;
            --gray-button: #9aa4b2;
            --danger-button: #e85d5d;

            /* 表单、列表与代码块 */
            --label-color: #666666;
            --hint-color: #88aaaa;
            --count-color: #9aa0a6;
            --control-border: #e5e5e5;
            --soft-border: #eeeeee;
            --divider: #f2f2f2;
            --hover-row: #f7f8fa;
            --code-bg: #f3f4f6;

            /* 结果输出与帮助文档中的代码块 */
            --console-bg: #111827;
            --console-text: #d1fae5;

            /* 右侧预览区 */
            --preview-bg: #ececec;
            --preview-width: 520px;
            --editor-min-width: 400px;
            --menu-stage: #f5f6f8;
            --pill-border: #e3e4e8;
            --icon: #6f6f6f;
            --phone-bar: #9a9a9a;
            --phone-width: 318px;
            --subpop-max-height: min(280px, 46vh);

            /* 弹窗 */
            --overlay: rgba(0, 0, 0, .38);
            --modal-shadow: 0 16px 40px rgba(0, 0, 0, .18);

            /* 字体与圆角 */
            --font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --mono-font: ui-monospace, Consolas, monospace;
            --card-radius: 12px;
            --control-radius: 8px;
        }

        /* ==================== 2. 页面骨架 ==================== */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: var(--font-family);
            background: var(--bg);
            color: var(--text);
        }

        /* 顶部工具栏固定高度，其余区域占满剩余空间。 */
        .topbar {
            flex: 0 0 56px;
            height: 56px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--topbar-bg);
            color: var(--topbar-text);
        }

        .topbar h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            flex: 0 1 auto;
            min-width: 0;
        }

        .topbar select,
        .topbar button {
            padding: 6px 10px;
            border: 0;
            border-radius: 6px;
            font-size: 13px;
        }

        /* 选择框可以收缩，按钮始终保持一行，避免窄屏时文字被拆开。 */
        .topbar select {
            flex: 0 1 auto;
            min-width: 0;
        }

        .topbar button {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .topbar .url {
            margin-left: auto;
            font-size: 12px;
            white-space: nowrap;
            opacity: .9;
        }

        /* 左侧编辑器 + 右侧预览；关闭预览时会加上 .no-preview。 */
        .layout {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(var(--editor-min-width), 1fr) var(--preview-width);
            overflow: hidden;
        }

        .layout.no-preview {
            grid-template-columns: 1fr;
        }

        .editor {
            min-height: 0;
            padding: 16px 18px 80px;
            overflow-y: auto;
        }

        .preview-wrap {
            height: 100%;
            min-height: 0;
            padding: 16px;
            border-left: 1px solid #dddddd;
            background: var(--preview-bg);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .preview-wrap.hidden {
            display: none;
        }

        #previewMenu,
        #previewPanel {
            height: 100%;
            min-height: 0;
        }

        /* ==================== 3. 页签、卡片与表单控件 ==================== */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tabs button {
            padding: 8px 14px;
            border: 0;
            border-radius: var(--control-radius);
            background: #ffffff;
            color: var(--label-color);
            cursor: pointer;
        }

        .tabs button.active {
            background: var(--blue);
            color: #ffffff;
        }

        .card {
            margin-bottom: 12px;
            padding: 14px;
            border-radius: var(--card-radius);
            background: var(--card);
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 8px 0 4px;
            font-size: 12px;
            color: var(--label-color);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--control-border);
            border-radius: var(--control-radius);
            font-size: 13px;
        }

        textarea {
            min-height: 72px;
            font-family: inherit;
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--hint-color);
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .btn {
            padding: 8px 12px;
            border: 0;
            border-radius: var(--control-radius);
            background: var(--primary-button);
            color: #ffffff;
            cursor: pointer;
        }

        .btn.gray {
            background: var(--gray-button);
        }

        .btn.danger {
            background: var(--danger-button);
        }

        /* 列表项与列表项内部的按钮共用同一套外观。 */
        .list-item,
        .mini-item {
            margin-bottom: 6px;
            padding: 8px 10px;
            border: 1px solid var(--soft-border);
            border-radius: var(--control-radius);
            font-size: 13px;
            cursor: pointer;
        }

        .list-item.active,
        .mini-item.active {
            border-color: var(--blue);
            background: var(--blue-soft);
        }

        /* 结果输出框，用于显示接口原始返回。 */
        .result {
            min-height: 72px;
            padding: 10px;
            border-radius: var(--control-radius);
            background: var(--console-bg);
            color: var(--console-text);
            font-size: 12px;
            white-space: pre-wrap;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            font-size: 13px;
        }

        .check input {
            width: auto;
        }

        /* 根据当前菜单项类型，只显示对应的一组输入框。 */
        .type-only {
            display: none;
        }

        .type-only.show {
            display: block;
        }

        .count {
            float: right;
            color: var(--count-color);
            font-weight: 400;
        }

        /* ==================== 4. 帮助文档排版 ==================== */
        .help {
            font-size: 14px;
            line-height: 1.75;
            color: #222222;
        }

        .help h1 {
            margin: 0 0 12px;
            font-size: 22px;
        }

        .help h2 {
            margin: 22px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--soft-border);
            font-size: 17px;
        }

        .help h3 {
            margin: 16px 0 8px;
            font-size: 15px;
        }

        .help p {
            margin: 8px 0;
        }

        .help ul,
        .help ol {
            margin: 8px 0;
            padding-left: 1.4em;
        }

        .help li {
            margin: 4px 0;
        }

        .help a {
            color: var(--blue);
        }

        .help code {
            padding: 1px 6px;
            border-radius: 4px;
            background: var(--code-bg);
            font-size: 12px;
        }

        .help pre {
            padding: 12px;
            border-radius: var(--control-radius);
            background: var(--console-bg);
            color: var(--console-text);
            overflow: auto;
        }

        .help pre code {
            padding: 0;
            background: transparent;
            color: inherit;
        }

        .help table {
            width: 100%;
            margin: 10px 0 16px;
            border-collapse: collapse;
            font-size: 13px;
        }

        .help th,
        .help td {
            padding: 8px 10px;
            border: 1px solid var(--soft-border);
            text-align: left;
            vertical-align: top;
        }

        .help th {
            background: var(--hover-row);
        }

        .help hr {
            margin: 18px 0;
            border: 0;
            border-top: 1px solid var(--soft-border);
        }

        /* ==================== 5. 弹窗 ==================== */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 30;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--overlay);
        }

        .modal[hidden] {
            display: none;
        }

        .modal-card {
            width: min(460px, 100%);
            padding: 18px 18px 16px;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: var(--modal-shadow);
        }

        .modal-card h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .modal-card p {
            margin: 0 0 10px;
            font-size: 14px;
        }

        .modal-card .ok {
            color: #16a34a;
            font-weight: 700;
        }

        .modal-card .fail {
            color: #dc2626;
            font-weight: 700;
        }

        .modal-list {
            max-height: 240px;
            margin: 8px 0 14px;
            overflow: auto;
        }

        .modal-list div {
            padding: 6px 0;
            border-top: 1px solid var(--divider);
            font-size: 13px;
        }

        /* ==================== 6. 预览区：官方菜单 ==================== */
        .official-menu {
            height: 100%;
            min-height: 0;
            padding: 28px 12px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-radius: 16px;
            background: var(--menu-stage);
            overflow: visible;
        }

        .menu-dock {
            position: relative;
        }

        .pill-stage {
            position: relative;
        }

        .pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 0 12px;
        }

        .pill {
            padding: 8px 11px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid var(--pill-border);
            border-radius: 999px;
            background: #ffffff;
            color: #333333;
            font-size: 13px;
            line-height: 1;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .02);
        }

        .pill svg {
            width: 14px;
            height: 14px;
            flex: 0 0 auto;
            color: var(--label-color);
        }

        .pill.switch-on {
            border-color: var(--switch-border);
            background: var(--switch-bg);
            color: var(--switch);
        }

        .pill.switch-on svg {
            color: var(--switch);
        }

        .dot {
            width: 7px;
            height: 7px;
            margin-left: 2px;
            display: inline-block;
            border-radius: 50%;
            background: var(--switch);
        }

        .composer {
            height: 44px;
            margin: 0 4px 14px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            border-radius: 10px;
            background: #ffffff;
            color: #333333;
            font-size: 14px;
            overflow: hidden;
            white-space: nowrap;
        }

        .toolbar {
            padding: 2px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            color: var(--icon);
        }

        .toolbar svg {
            width: 26px;
            height: 26px;
        }

        /* 子菜单气泡：位置由 placeSubmenu() 计算。 */
        .subpop {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            transform: translateX(-50%);
            z-index: 8;
            min-width: 168px;
            max-width: calc(100% - 8px);
            max-height: var(--subpop-max-height);
            border-radius: var(--card-radius);
            background: #ffffff;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .subpop::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -5px;
            width: 10px;
            height: 10px;
            background: #ffffff;
            transform: translateX(-50%) rotate(45deg);
            box-shadow: 2px 2px 4px rgba(0, 0, 0, .04);
        }

        .subpop div {
            position: relative;
            z-index: 1;
            padding: 12px 16px;
            border-top: 1px solid var(--soft-border);
            background: #ffffff;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }

        .subpop div:first-child {
            border-top: 0;
        }

        .subpop div:hover {
            background: var(--hover-row);
        }

        /* ==================== 7. 预览区：指令面板 ==================== */
        .official-panel {
            min-height: 100%;
            padding: 18px 12px 24px;
            border-radius: 16px;
            background: #ffffff;
        }

        .panel-tabs {
            width: var(--phone-width);
            margin: 0 auto;
            padding: 2px 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
        }

        .panel-tabs span {
            padding: 4px 2px;
            color: var(--sub);
            cursor: pointer;
            user-select: none;
        }

        .panel-tabs span.active {
            color: var(--blue);
            font-weight: 500;
        }

        .phone {
            width: var(--phone-width);
            margin: 0 auto;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: #ffffff;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .08);
            overflow: hidden;
        }

        .phone-bar {
            height: 46px;
            background: var(--phone-bar);
        }

        .phone-body {
            min-height: 430px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .bot-row {
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8c8c8c;
            font-size: 12px;
        }

        .avatar,
        .mini-avatar {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, #ffffff 0 18%, transparent 19%),
                linear-gradient(180deg, #9fd2ff, #4aa7ff);
        }

        .cmd-list {
            flex: 1;
        }

        .cmd-row {
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid var(--divider);
            font-size: 15px;
            cursor: pointer;
        }

        .cmd-row .left {
            color: #222222;
        }

        .cmd-row .right {
            max-width: 58%;
            color: #a0a0a0;
            font-size: 13px;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .phone-foot {
            padding: 14px 18px 16px;
            display: flex;
            justify-content: flex-start;
        }

        .mini-avatar {
            width: 28px;
            height: 28px;
            box-shadow: 0 3px 0 -1px var(--blue);
        }

        .empty-hint {
            padding: 18px 16px;
            color: #bbbbbb;
            font-size: 13px;
        }

        /* ==================== 8. 窄屏适配 ==================== */
        /* 窗口较窄时取消左右分栏，预览区改为编辑器下方单独一屏。 */
        @media (max-width: 980px) {
            html,
            body {
                height: auto;
                overflow: auto;
            }

            body {
                display: block;
            }

            .layout {
                display: block;
                overflow: visible;
            }

            .preview-wrap {
                height: auto;
                min-height: 560px;
                border-top: 1px solid #dddddd;
                border-left: 0;
            }

            .official-menu,
            .official-panel {
                min-height: 520px;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== 顶部工具栏 ==================== -->
    <!-- 按钮统一用 data-action 标记行为，具体处理函数见脚本里的 ACTION_HANDLERS。 -->
    <div class="topbar">
        <h1 id="pageTitle">QQ 自定义菜单与指令面板</h1>
        <select id="botSelect" aria-label="选择 Bot"></select>
        <button type="button" data-action="refresh">刷新</button>
        <span class="url" id="urlText"></span>
    </div>

    <!-- ==================== 主体：左侧编辑器 / 右侧预览 ==================== -->
    <div class="layout" id="layout">
        <div class="editor">
            <!-- 页签：五个页签共用一个编辑区，切换时只显示其中一个。 -->
            <div class="tabs" role="tablist">
                <button type="button" class="active" data-action="show-tab" data-tab="menu" role="tab">自定义菜单</button>
                <button type="button" data-action="show-tab" data-tab="panel" role="tab">指令面板</button>
                <button type="button" data-action="show-tab" data-tab="browse" role="tab">指令浏览</button>
                <button type="button" data-action="show-tab" data-tab="settings" role="tab">全局设置</button>
                <button type="button" data-action="show-tab" data-tab="help" role="tab">帮助文档</button>
            </div>

            <!-- ==================== 页签一：自定义菜单 ==================== -->
            <section id="tab-menu" role="tabpanel">
                <div class="card">
                    <h3>菜单项 items（最多 10 个，从左到右）</h3>
                    <!-- 菜单项列表由 renderMenuList() 生成。 -->
                    <div id="menuList"></div>
                    <div class="row">
                        <button type="button" class="btn" data-action="add-menu">新增</button>
                        <button type="button" class="btn gray" data-action="delete-menu">删除</button>
                        <button type="button" class="btn gray" data-action="move-menu" data-delta="-1">上移</button>
                        <button type="button" class="btn gray" data-action="move-menu" data-delta="1">下移</button>
                        <button type="button" class="btn gray" data-action="fill-example" data-kind="menu">填入示例</button>
                    </div>
                </div>

                <div class="card">
                    <h3>菜单项编辑</h3>

                    <label for="menuName">名称 name <span class="count" id="menuNameCount">0/10</span></label>
                    <input id="menuName">

                    <label for="menuType">类型 type</label>
                    <select id="menuType"></select>

                    <!-- 以下四组输入框按当前类型显示，切换 type 时由 setTypeBox() 控制。 -->
                    <div class="type-only" id="boxMenuSend">
                        <label for="menuSend">发送内容 send_message</label>
                        <input id="menuSend">
                    </div>

                    <div class="type-only" id="boxMenuLink">
                        <label for="menuLink">链接 link</label>
                        <input id="menuLink">
                    </div>

                    <div class="type-only" id="boxMenuSwitch">
                        <label for="menuSwitchId">开关标识 switch_id</label>
                        <input id="menuSwitchId">
                        <label for="menuSwitchDefault">开关默认 default</label>
                        <select id="menuSwitchDefault">
                            <option value="false">关闭 False</option>
                            <option value="true">开启 True</option>
                        </select>
                    </div>

                    <div class="hint" id="menuHint"></div>

                    <div class="type-only" id="boxMenuSub">
                        <h3 style="margin-top:16px">子菜单 sub_menu_items（仅类型=子菜单，最多 5 项）</h3>

    <!-- ==================== 弹窗二：二次确认 ==================== -->
    <!-- 不用 window.confirm()：iframe 沙箱里原生对话框会被拦截。 -->
    <div class="modal" id="confirmModal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">

                <button type="button" class="btn" data-action="finish-confirm" data-accepted="true">确认</button>

    <script>
        // ==================== 1. 常量与状态 ====================
        // 四个指令面板场景，顺序与后端 config.SCOPE_* 常量一致。
        const SCOPE_ORDER = [
            ['channel', 'QQ频道'],
            ['dm', '频道私信'],
            ['group', 'QQ群'],
            ['c2c', '消息列表'],
        ];

        // 菜单项与子菜单项的行内图标，用于右侧预览。
        const ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
            + 'stroke-linecap="round" stroke-linejoin="round">'
            + '<path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg>';
        const ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
            + 'stroke-linecap="round" stroke-linejoin="round">'
            + '<path d="M10 13a5 5 0 0 0 7.54.54l1-1a5 5 0 0 0-7.07-7.07l-1.1 1.1"/>'
            + '<path d="M14 11a5 5 0 0 0-7.54-.54l-1 1a5 5 0 0 0 7.07 7.07l1.1-1.1"/></svg>';
        const ICON_MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'
            + '<rect x="4" y="4" width="6.4" height="6.4" rx="1.3"/>'
            + '<rect x="13.6" y="4" width="6.4" height="6.4" rx="1.3"/>'
            + '<rect x="4" y="13.6" width="6.4" height="6.4" rx="1.3"/>'
            + '<rect x="13.6" y="13.6" width="6.4" height="6.4" rx="1.3"/></svg>';

        // 后端快照，由 api('state') / api('bootstrap') 的返回值覆盖。
        let state = null;
        // 当前选中的 Bot hash，切换下拉框时更新。
        let botHash = '';
        // 当前页签：menu / panel / browse / settings / help。
        let tab = PAGE_CONFIG.defaultTab;
        // 菜单、子菜单、面板、面板元素四个列表的选中下标。
        let menuIndex = 0;
        let subIndex = 0;
        let panelIndex = 0;
        let itemIndex = 0;
        // 当前指令面板场景：channel / dm / group / c2c。
        let scope = 'channel';
        // 预览区展开的子菜单下标，-1 表示不展开。
        let expandedMenu = -1;
        // 预览区里手动点过的开关状态；只影响预览，不回写配置。
        let switchPreview = {};

        // ==================== 2. 通用工具 ====================
        function getElement(id) {
            return document.getElementById(id);
        }

        // 所有插入到 innerHTML 的数据都要先经过这里，避免草稿内容被当成 HTML 执行。
        function escapeHtml(value) {
            const text = String(value == null ? '' : value);
            const table = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            };
            return text.replace(/[&<>"']/g, (ch) => table[ch]);
        }

        // QQ 侧按“半角算 1、全角算 2”计算可显示宽度，用于字数提示。
        function qqWidth(text) {
            let width = 0;
            for (const ch of String(text || '')) {
                width += ch.charCodeAt(0) <= 0x7F ? 1 : 2;
            }
            return width;
        }

        function showNotice(message) {
            getElement('resultBox').textContent = message;
        }

        // ==================== 3. 与 OlivOS 宿主通信 ====================
        // 每个请求一个 id：发出时登记，收到回包或超时后注销。
        const pendingRequests = new Map();
        let requestSequence = 0;
        const pageRequestId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);

        // 宿主回包：校验来源 → 匹配请求 id → 区分顶层 error 与业务 ok。
        window.addEventListener('message', (event) => {
            if (event.source !== window.parent) {
                return;
            }
            const reply = event.data;
            if (!reply || reply.type !== 'olivos:plugin_reply') {
                return;
            }
            const pending = pendingRequests.get(reply.request_id);
            if (!pending) {
                return;
            }
            pendingRequests.delete(reply.request_id);
            clearTimeout(pending.timer);
            getElement('botSelect').disabled = false;

            if (typeof reply.error === 'string') {
                pending.reject(new Error(reply.error));
                return;
            }
            if (!reply.payload || typeof reply.payload !== 'object' || Array.isArray(reply.payload)) {
                pending.reject(new Error('OlivOS 返回了无效的数据'));
                return;
            }
            if (reply.payload.ok !== true) {
                pending.reject(new Error(reply.payload.message || '请求失败'));
                return;
            }
            pending.resolve(reply.payload);
        });

        // 统一请求入口：action 会与 body 合并后发给 webui.py。
        function api(action, body = {}) {
            if (window.parent === window) {
                return Promise.reject(new Error('请从 OlivOS WebUI 的「插件页面」打开「QQ菜单与指令面板」'));
            }
            // 同一时间只允许一个请求，避免草稿互相覆盖。
            if (pendingRequests.size) {
                return Promise.reject(new Error('正在处理上一项操作，请稍候'));
            }

            return new Promise((resolve, reject) => {
                const requestId = pageRequestId + '-' + (++requestSequence);
                const timer = setTimeout(() => {
                    pendingRequests.delete(requestId);
                    getElement('botSelect').disabled = false;
                    reject(new Error('请求超时，请刷新并核对结果后再操作；超时不代表操作未执行'));
                }, PAGE_CONFIG.requestTimeoutMs);

                pendingRequests.set(requestId, {resolve, reject, timer});
                getElement('botSelect').disabled = true;
                try {
                    window.parent.postMessage({
                        type: 'olivos:plugin_event',
                        event: PAGE_CONFIG.eventName,
                        request_id: requestId,
                        payload: Object.assign({}, body, {action}),
                    }, '*');
                } catch (error) {
                    clearTimeout(timer);
                    pendingRequests.delete(requestId);
                    getElement('botSelect').disabled = false;
                    reject(error);
                }
            });
        }

        // 任何漏掉的 Promise 异常都直接显示到结果框，避免静默失败。
        window.addEventListener('unhandledrejection', (event) => {
            showNotice(event.reason instanceof Error ? event.reason.message : String(event.reason));
            event.preventDefault();
        });

        // ==================== 4. 二次确认框 ====================
        let confirmResolve = null;
        let confirmTrigger = null;

        function confirmAction(message) {
            if (confirmResolve) {
                return Promise.resolve(false);
            }
            getElement('confirmText').textContent = message;
            getElement('confirmModal').hidden = false;
            confirmTrigger = document.activeElement;
            getElement('confirmCancel').focus();
            return new Promise((resolve) => {
                confirmResolve = resolve;
            });
        }

        function finishConfirm(accepted) {
            getElement('confirmModal').hidden = true;
            const resolve = confirmResolve;
            confirmResolve = null;
            if (confirmTrigger) {
                confirmTrigger.focus();
            }
            if (resolve) {
                resolve(accepted);
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && confirmResolve) {
                finishConfirm(false);
            }
        });

        // ==================== 5. 页签切换 ====================
        function showTab(name) {
            tab = name;
            const showPreview = PAGE_CONFIG.features.preview && (name === 'menu' || name === 'panel');

            document.querySelectorAll('.tabs button').forEach((button) => {
                button.classList.toggle('active', button.dataset.tab === name);
            });
            ['menu', 'panel', 'browse', 'settings', 'help'].forEach((id) => {
                getElement('tab-' + id).hidden = id !== name;
            });

            getElement('previewMenu').hidden = name !== 'menu';
            getElement('previewPanel').hidden = name !== 'panel';
            getElement('previewWrap').hidden = !showPreview;
            getElement('previewWrap').classList.toggle('hidden', !showPreview);
            getElement('layout').classList.toggle('no-preview', !showPreview);
            render();
        }

        // ==================== 6. 帮助文档 Markdown 渲染 ====================
        // 只支持帮助文档用到的语法：标题、段落、列表、表格、代码块、链接、加粗、行内代码。
        function renderMarkdown(src) {
            const raw = String(src || '').replace(/\r\n/g, '\n');

            // 先抽出代码块，避免块内内容被后续规则误判。
            const fences = [];
            let text = raw.replace(/```[\w-]*\n([\s\S]*?)```/g, (match, code) => {
                const token = '%%FENCE' + fences.length + '%%';
                fences.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
                return '\n' + token + '\n';
            });

            function inline(value) {
                let out = escapeHtml(value);
                out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
                out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                out = out.replace(
                    /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
                    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>',
                );
                return out;
            }

            const lines = text.split('\n');
            const html = [];
            let paragraph = [];
            let listType = '';
            let tableRows = [];

            function flushParagraph() {
                if (paragraph.length) {
                    html.push('<p>' + inline(paragraph.join(' ')) + '</p>');
                    paragraph = [];
                }
            }

            function flushList() {
                if (listType) {
                    html.push(listType === 'ol' ? '</ol>' : '</ul>');
                    listType = '';
                }
            }

            function flushTable() {
                if (!tableRows.length) {
                    return;
                }
                const rows = tableRows.slice();
                tableRows = [];

                // 第二行是 |---|---| 时才按表格渲染，否则退回普通段落。
                const isTable = rows.length >= 2
                    && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(rows[1]);
                if (!isTable) {
                    rows.forEach((line) => paragraph.push(line));
                    flushParagraph();
                    return;
                }

                const cells = (line) => line
                    .replace(/^\|/, '')
                    .replace(/\|$/, '')
                    .split('|')
                    .map((item) => item.trim());

                const head = cells(rows[0])
                    .map((item) => '<th>' + inline(item) + '</th>')
                    .join('');
                let table = '<table><thead><tr>' + head + '</tr></thead><tbody>';
                rows.slice(2).forEach((line) => {
                    const body = cells(line).map((item) => '<td>' + inline(item) + '</td>').join('');
                    table += '<tr>' + body + '</tr>';
                });
                html.push(table + '</tbody></table>');
            }

            function openList(nextType) {
                if (listType !== nextType) {
                    flushList();
                    listType = nextType;
                    html.push(nextType === 'ol' ? '<ol>' : '<ul>');
                }
            }

            lines.forEach((line) => {
                const fence = line.trim().match(/^%%FENCE(\d+)%%$/);
                if (fence) {
                    flushParagraph();
                    flushList();
                    flushTable();
                    html.push(fences[Number(fence[1])] || '');
                    return;
                }

                if (/^\s*\|.+\|\s*$/.test(line)) {
                    flushParagraph();
                    flushList();
                    tableRows.push(line);
                    return;
                }
                if (tableRows.length) {
                    flushTable();
                }

                if (!line.trim()) {
                    flushParagraph();
                    flushList();
                    return;
                }

                const heading = line.match(/^(#{1,3})\s+(.+)$/);
                if (heading) {
                    flushParagraph();
                    flushList();
                    const level = heading[1].length;
                    html.push('<h' + level + '>' + inline(heading[2]) + '</h' + level + '>');
                    return;
                }

                if (/^---+$/.test(line.trim())) {
                    flushParagraph();
                    flushList();
                    html.push('<hr />');
                    return;
                }

                const unordered = line.match(/^\s*[-*]\s+(.+)$/);
                if (unordered) {
                    flushParagraph();
                    openList('ul');
                    html.push('<li>' + inline(unordered[1]) + '</li>');
                    return;
                }

                const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
                if (ordered) {
                    flushParagraph();
                    openList('ol');
                    html.push('<li>' + inline(ordered[1]) + '</li>');
                    return;
                }

                flushList();
                paragraph.push(line);
            });

            flushParagraph();
            flushList();
            flushTable();
            return html.join('\n');
        }

        // ==================== 7. 当前草稿对象的快捷取值 ====================
        function currentMenu() {
            const items = (state.menu_draft && state.menu_draft.items) || [];
            return items[menuIndex] || null;
        }

        function currentPanels() {
            return ((state.panel_drafts || {})[scope]) || [];
        }

        function currentPanel() {
            return currentPanels()[panelIndex] || null;
        }

        function currentItem() {
            const panel = currentPanel();
            return panel && panel.items ? panel.items[itemIndex] : null;
        }

        function fillSelect(id, options, value) {
            const element = getElement(id);
            element.innerHTML = (options || [])
                .map((opt) => `<option value="${escapeHtml(opt.value)}">${escapeHtml(opt.label)}</option>`)
                .join('');
            element.value = value;
        }

        function setTypeBox(id, show) {
            getElement(id).classList.toggle('show', !!show);
        }

        // ==================== 8. 各区域渲染 ====================
        function renderBots() {
            getElement('botSelect').innerHTML = (state.bots || [])
                .map((bot) => `<option value="${escapeHtml(bot.hash)}">${escapeHtml(bot.display)}</option>`)
                .join('');
            getElement('botSelect').value = botHash;
            getElement('urlText').textContent = 'OlivOS 插件页面';

            const bot = (state.bots || []).find((item) => item.hash === botHash);
            getElement('botName').textContent = bot ? (bot.name || bot.display) : '官方机器人';
        }

        function renderMenuList() {
            const items = (state.menu_draft && state.menu_draft.items) || [];
            getElement('menuList').innerHTML = items.map((item, index) => {
                const extra = item.type === 'menu'
                    ? ((item.sub_menu_items || []).length + ' 个子项')
                    : (item.send_message || item.link || (item.switch || {}).switch_id || '');
                const active = index === menuIndex ? ' active' : '';
                return `<div class="list-item${active}" data-action="select-menu" data-index="${index}">`
                    + `${index + 1}. ${escapeHtml(item.name || '未命名')} [${escapeHtml(item.type)}] `
                    + `${escapeHtml(extra)}</div>`;
            }).join('') || "<div class='hint'>还没有菜单项</div>";

            // 右侧表单显示当前选中的菜单项；没有选中项时用空白项占位。
            const item = currentMenu() || {
                name: '',
                type: 'send_message',
                send_message: '',
                link: '',
                switch: {switch_id: '', default: false},
                sub_menu_items: [],
            };
            getElement('menuName').value = item.name || '';
            getElement('menuNameCount').textContent = qqWidth(item.name || '') + '/10';
            fillSelect('menuType', state.menu_type_options, item.type);
            getElement('menuSend').value = item.send_message || '';
            getElement('menuLink').value = item.link || '';
            getElement('menuSwitchId').value = (item.switch || {}).switch_id || '';
            getElement('menuSwitchDefault').value = (item.switch || {}).default ? 'true' : 'false';

            // 不同类型显示不同的提示文案。
            let hintKey = 'menu_send';
            if (item.type === 'link') {
                hintKey = 'menu_link';
            } else if (item.type === 'switch') {
                hintKey = 'menu_switch_id';
            } else if (item.type === 'menu') {
                hintKey = 'menu_type';
            }
            getElement('menuHint').textContent = (state.field_hints || {})[hintKey] || '';

            setTypeBox('boxMenuSend', item.type === 'send_message');
            setTypeBox('boxMenuLink', item.type === 'link');
            setTypeBox('boxMenuSwitch', item.type === 'switch');
            setTypeBox('boxMenuSub', item.type === 'menu');

            const subs = item.sub_menu_items || [];
            getElement('subList').innerHTML = subs.map((sub, index) => {
                const active = index === subIndex ? ' active' : '';
                return `<div class="mini-item${active}" data-action="select-sub" data-index="${index}">`
                    + `${index + 1}. ${escapeHtml(sub.name || '未命名')} [${escapeHtml(sub.type)}]</div>`;
            }).join('');

            const sub = subs[subIndex] || {name: '', type: 'send_message', send_message: '', link: ''};
            getElement('subName').value = sub.name || '';
            fillSelect('subType', state.sub_menu_type_options, sub.type);
            getElement('subSend').value = sub.send_message || '';
            getElement('subLink').value = sub.link || '';
        }

        function renderPanelList() {
            getElement('unified').checked = !!state.unified_panel_mode;

            const panels = currentPanels();
            getElement('panelList').innerHTML = panels.map((panel, index) => {
                const active = index === panelIndex ? ' active' : '';
                const summary = `${index + 1}. ${escapeHtml(panel.remark || '未备注')} | `
                    + `${escapeHtml(panel.target_type)} | ${(panel.items || []).length}项 | `
                    + `${escapeHtml(panel.panel_id || '未提交')}`;
                return `<div class="list-item${active}" data-action="select-panel" data-index="${index}">`
                    + summary + '</div>';
            }).join('') || "<div class='hint'>还没有指令面板</div>";

            const panel = currentPanel() || {
                remark: '',
                panel_id: '',
                target_type: 'all',
                user_openids: [],
                group_openids: [],
                items: [],
            };
            getElement('panelRemark').value = panel.remark || '';
            getElement('panelId').value = panel.panel_id || '';
            fillSelect('targetType', state.target_type_options, panel.target_type || 'all');
            getElement('panelHint').textContent = (state.field_hints || {}).target_type || '';

            // 只有 c2c 场景用用户 openid，group 场景用群 openid。
            const openids = scope === 'c2c' ? (panel.user_openids || []) : (panel.group_openids || []);
            getElement('openidBox').value = openids.join('\n');

            const items = panel.items || [];
            getElement('itemList').innerHTML = items.map((item, index) => {
                const active = index === itemIndex ? ' active' : '';
                const adminMark = item.only_admin ? ' [管理员]' : '';
                const summary = `${index + 1}. ${escapeHtml(item.name || '未命名')} `
                    + `[${escapeHtml(item.type)}] ${escapeHtml(item.desc || '')}${adminMark}`;
                return `<div class="mini-item${active}" data-action="select-item" data-index="${index}">`
                    + summary + '</div>';
            }).join('');

            const item = items[itemIndex] || {name: '', desc: '', type: 'command', link: '', only_admin: false};
            getElement('itemName').value = item.name || '';
            getElement('itemDesc').value = item.desc || '';
            getElement('itemNameCount').textContent = qqWidth(item.name || '') + '/14';
            getElement('itemDescCount').textContent = qqWidth(item.desc || '') + '/30';
            fillSelect('itemType', state.panel_item_type_options, item.type || 'command');
            getElement('itemLink').value = item.link || '';
            getElement('itemAdmin').value = item.only_admin ? 'true' : 'false';
            getElement('itemHint').textContent = (state.field_hints || {})[
                item.type === 'link' ? 'panel_item_link' : 'panel_item_name'
            ] || '';
            setTypeBox('boxItemLink', item.type === 'link');
        }

        // 指令面板里的 command 类型需要带前导斜杠，其余类型按原样显示。
        function commandName(item) {
            const name = item.name || '';
            if (item.type === 'command' && name && name[0] !== '/') {
                return '/' + name;
            }
            return name;
        }

        function renderPreview() {
            const items = (state.menu_draft && state.menu_draft.items) || [];

            getElement('menuPills').innerHTML = items.map((item, index) => {
                const switchId = (item.switch && item.switch.switch_id) || ('sw' + index);
                const hasPreviewSwitch = Object.prototype.hasOwnProperty.call(switchPreview, switchId);
                const on = item.type === 'switch'
                    && (hasPreviewSwitch ? switchPreview[switchId] : !!(item.switch && item.switch.default));

                let icon = '';
                if (item.type === 'send_message') {
                    icon = ICON_SEND;
                } else if (item.type === 'link') {
                    icon = ICON_LINK;
                } else if (item.type === 'menu') {
                    icon = ICON_MENU;
                }

                const classes = on ? 'pill switch-on' : 'pill';
                const dot = on ? '<span class="dot"></span>' : '';
                return `<div class="${classes}" data-action="click-menu" data-index="${index}">`
                    + `${icon}<span>${escapeHtml(item.name || item.type)}</span>${dot}</div>`;
            }).join('');

            // 展开的子菜单气泡：只有 menu 类型会展开。
            const expanded = items[expandedMenu];
            if (expanded && expanded.type === 'menu') {
                const subItems = (expanded.sub_menu_items || []).map((sub, index) => {
                    return `<div data-action="click-sub" data-parent="${expandedMenu}" data-index="${index}">`
                        + `${escapeHtml(sub.name || sub.type)}</div>`;
                }).join('');
                getElement('menuSub').hidden = false;
                getElement('menuSub').innerHTML = subItems || '<div>还没有子项</div>';
                placeSubmenu(expandedMenu);
            } else {
                getElement('menuSub').hidden = true;
                getElement('menuSub').style.left = '50%';
                getElement('menuSub').style.transform = 'translateX(-50%)';
            }

            getElement('previewScopeTabs').innerHTML = SCOPE_ORDER.map(([key, label]) => {
                const active = key === scope ? 'active' : '';
                return `<span class="${active}" data-action="change-scope" data-scope="${key}">${label}</span>`;
            }).join('');

            const panel = currentPanel();
            const rows = (panel && panel.items) || [];
            getElement('panelRows').innerHTML = rows.map((item, index) => {
                const name = commandName(item);
                const desc = item.desc || (item.type === 'link' ? (item.link || '链接跳转') : '');
                return `<div class="cmd-row" data-action="select-item" data-index="${index}">`
                    + `<span class="left">${escapeHtml(name)}</span>`
                    + `<span class="right">${escapeHtml(desc)}</span></div>`;
            }).join('') || '<div class="empty-hint">还没有指令</div>';
        }

        // 把菜单草稿和面板草稿里的所有条目汇总成一个可搜索的列表。
        function renderBrowse() {
            const key = (getElement('browseKey').value || '').toLowerCase();
            const rows = [];

            ((state.menu_draft && state.menu_draft.items) || []).forEach((item) => {
                rows.push({
                    source: '自定义菜单',
                    scope: 'c2c',
                    name: item.name,
                    type: item.type,
                    desc: item.send_message || item.link || (item.switch || {}).switch_id || '',
                });
                (item.sub_menu_items || []).forEach((sub) => {
                    rows.push({
                        source: '自定义菜单/子菜单',
                        scope: 'c2c',
                        name: sub.name,
                        type: sub.type,
                        desc: sub.send_message || sub.link || '',
                    });
                });
            });

            Object.keys(state.panel_drafts || {}).forEach((scopeKey) => {
                (state.panel_drafts[scopeKey] || []).forEach((panel) => {
                    (panel.items || []).forEach((item) => {
                        rows.push({
                            source: '指令面板',
                            scope: scopeKey,
                            name: item.name,
                            type: item.type,
                            desc: item.desc || item.link || '',
                            admin: item.only_admin,
                            panel_id: panel.panel_id,
                        });
                    });
                });
            });

            getElement('browseList').innerHTML = rows
                .filter((row) => JSON.stringify(row).toLowerCase().includes(key))
                .map((row) => {
                    return `<div class="list-item">${escapeHtml(row.source)} / ${escapeHtml(row.scope)} / `
                        + `${escapeHtml(row.name)} [${escapeHtml(row.type)}] ${escapeHtml(row.desc || '')}</div>`;
                })
                .join('');
        }

        function renderSettings() {
            getElement('globalEnable').value = state.global_enable_switch ? 'true' : 'false';
            getElement('globalDebug').value = state.global_debug_mode_switch ? 'true' : 'false';
            getElement('botEnable').value = state.bot_enable_switch ? 'true' : 'false';

            const core = state.core_masters || [];
            if (!state.has_olivadice) {
                getElement('coreMasters').innerHTML = '未检测到 OlivaDiceCore';
            } else if (core.length) {
                getElement('coreMasters').innerHTML = core
                    .map((id) => `<div class="list-item">${escapeHtml(id)}</div>`)
                    .join('');
            } else {
                getElement('coreMasters').innerHTML = '当前没有全局骰主';
            }

            getElement('pluginMasters').innerHTML = (state.plugin_masters || []).map((id) => {
                return `<div class="list-item">${escapeHtml(id)} `
                    + `<button type="button" class="btn gray" data-action="delete-master" `
                    + `data-id="${escapeHtml(id)}">删除</button></div>`;
            }).join('') || '还没有插件骰主';
        }

        // 一次性刷新所有区域。编辑输入框由各自的 apply* 函数局部刷新，避免打断输入。
        function render() {
            if (!state) {
                return;
            }
            renderBots();
            renderMenuList();
            renderPanelList();
            renderPreview();
            renderBrowse();
            renderSettings();
            getElement('helpBox').innerHTML = renderMarkdown(state.help_text || '');
        }

        // ==================== 9. 列表选中 ====================
        function selectMenu(index) {
            menuIndex = index;
            subIndex = 0;
            render();
        }

        function selectSub(index) {
            subIndex = index;
            render();
        }

        function selectPanel(index) {
            panelIndex = index;
            itemIndex = 0;
            render();
        }

        function selectItem(index) {
            itemIndex = index;
            render();
        }

        function changeScope(nextScope) {
            scope = nextScope;
            panelIndex = 0;
            itemIndex = 0;
            render();
        }

        // ==================== 10. 表单 → 草稿 ====================
        // 下面四个 apply* 函数把输入框内容写回 state，只重绘受影响的区域。
        function applyMenu() {
            const items = (state.menu_draft && state.menu_draft.items) || [];
            if (!items[menuIndex]) {
                return;
            }
            items[menuIndex].name = getElement('menuName').value;
            items[menuIndex].type = getElement('menuType').value;
            items[menuIndex].send_message = getElement('menuSend').value;
            items[menuIndex].link = getElement('menuLink').value;
            items[menuIndex].switch = {
                switch_id: getElement('menuSwitchId').value,
                default: getElement('menuSwitchDefault').value === 'true',
            };
            getElement('menuNameCount').textContent = qqWidth(items[menuIndex].name || '') + '/10';
            renderPreview();
            renderMenuList();
        }

        function applySub() {
            const item = currentMenu();
            if (!item || !item.sub_menu_items || !item.sub_menu_items[subIndex]) {
                return;
            }
            const sub = item.sub_menu_items[subIndex];
            sub.name = getElement('subName').value;
            sub.type = getElement('subType').value;
            sub.send_message = getElement('subSend').value;
            sub.link = getElement('subLink').value;
            renderPreview();
            renderMenuList();
        }

        function applyPanel() {
            const panel = currentPanel();
            if (!panel) {
                return;
            }
            panel.remark = getElement('panelRemark').value;
            panel.panel_id = getElement('panelId').value;
            panel.target_type = getElement('targetType').value;
            panel.scope = scope;

            const openids = getElement('openidBox').value
                .split(/[\s,;，；]+/)
                .map((item) => item.trim())
                .filter(Boolean);
            if (scope === 'c2c') {
                panel.user_openids = openids;
            }
            if (scope === 'group') {
                panel.group_openids = openids;
            }
            // 频道与频道私信不支持定向，强制回全量。
            if (['channel', 'dm'].includes(scope)) {
                panel.target_type = 'all';
            }

            if (state.unified_panel_mode) {
                syncUnified(panel);
            }
            renderPreview();
        }

        function applyItem() {
            const item = currentItem();
            if (!item) {
                return;
            }
            item.name = getElement('itemName').value;
            item.desc = getElement('itemDesc').value;
            item.type = getElement('itemType').value;
            item.link = getElement('itemLink').value;
            item.only_admin = getElement('itemAdmin').value === 'true';
            if (state.unified_panel_mode && currentPanel()) {
                syncUnified(currentPanel());
            }
            render();
        }

        // 统一配置：把当前面板复制到其他三个场景，保留各自的 panel_id。
        function syncUnified(source) {
            SCOPE_ORDER.forEach(([key]) => {
                const copy = JSON.parse(JSON.stringify(source));
                copy.scope = key;
                if (['channel', 'dm'].includes(key)) {
                    copy.target_type = 'all';
                    copy.user_openids = [];
                    copy.group_openids = [];
                }
                const exist = (state.panel_drafts[key] || [])[0];
                if (exist) {
                    copy.panel_id = exist.panel_id;
                    copy.local_id = exist.local_id;
                    copy.version = exist.version;
                    state.panel_drafts[key][0] = copy;
                } else {
                    state.panel_drafts[key] = [copy];
                }
            });
        }

        function onUnified() {
            state.unified_panel_mode = getElement('unified').checked;
            if (state.unified_panel_mode && currentPanel()) {
                syncUnified(currentPanel());
            }
            render();
        }

        // ==================== 11. 列表增删与排序 ====================
        function addMenu() {
            state.menu_draft.items = state.menu_draft.items || [];
            if (state.menu_draft.items.length >= (state.limits.menu_item_max || 10)) {
                showNotice('最多 10 项');
                return;
            }
            state.menu_draft.items.push({
                name: '',
                type: 'send_message',
                send_message: '',
                link: '',
                switch: {switch_id: '', default: false},
                sub_menu_items: [],
            });
            menuIndex = state.menu_draft.items.length - 1;
            render();
        }

        function delMenu() {
            const items = state.menu_draft.items || [];
            if (!items.length) {
                return;
            }
            items.splice(menuIndex, 1);
            menuIndex = Math.max(0, menuIndex - 1);
            expandedMenu = -1;
            render();
        }

        function moveMenu(delta) {
            const items = state.menu_draft.items || [];
            const next = menuIndex + delta;
            if (next < 0 || next >= items.length) {
                return;
            }
            [items[menuIndex], items[next]] = [items[next], items[menuIndex]];
            menuIndex = next;
            render();
        }

        function addSub() {
            const item = currentMenu();
            if (!item || item.type !== 'menu') {
                showNotice('只有子菜单类型才能添加子项');
                return;
            }
            item.sub_menu_items = item.sub_menu_items || [];
            if (item.sub_menu_items.length >= 5) {
                showNotice('子菜单最多 5 项');
                return;
            }
            item.sub_menu_items.push({name: '', type: 'send_message', send_message: '', link: ''});
            subIndex = item.sub_menu_items.length - 1;
            render();
        }

        function delSub() {
            const item = currentMenu();
            if (!item || !item.sub_menu_items) {
                return;
            }
            item.sub_menu_items.splice(subIndex, 1);
            subIndex = Math.max(0, subIndex - 1);
            render();
        }

        function addPanel() {
            state.panel_drafts[scope] = state.panel_drafts[scope] || [];
            if (state.panel_drafts[scope].length >= 20) {
                showNotice('最多 20 个面板');
                return;
            }
            state.panel_drafts[scope].push({
                local_id: 'local_' + Date.now(),
                panel_id: '',
                scope: scope,
                target_type: 'all',
                remark: '',
                items: [],
                user_openids: [],
                group_openids: [],
            });
            panelIndex = state.panel_drafts[scope].length - 1;
            render();
        }

        function delPanel() {
            const panels = currentPanels();
            if (!panels.length) {
                return;
            }
            panels.splice(panelIndex, 1);
            panelIndex = Math.max(0, panelIndex - 1);
            render();
        }

        function addItem() {
            const panel = currentPanel();
            if (!panel) {
                showNotice('请先新建面板');
                return;
            }
            panel.items = panel.items || [];
            if (panel.items.length >= 20) {
                showNotice('最多 20 个元素');
                return;
            }
            panel.items.push({name: '', desc: '', type: 'command', only_admin: false, link: ''});
            itemIndex = panel.items.length - 1;
            render();
        }

        function delItem() {
            const panel = currentPanel();
            if (!panel || !panel.items) {
                return;
            }
            panel.items.splice(itemIndex, 1);
            itemIndex = Math.max(0, itemIndex - 1);
            render();
        }

        function moveItem(delta) {
            const panel = currentPanel();
            if (!panel) {
                return;
            }
            const next = itemIndex + delta;
            if (next < 0 || next >= panel.items.length) {
                return;
            }
            [panel.items[itemIndex], panel.items[next]] = [panel.items[next], panel.items[itemIndex]];
            itemIndex = next;
            render();
        }

        // ==================== 12. 预览区交互 ====================
        // 让子菜单气泡尽量居中对齐对应的按钮，并限制在预览区内。
        function placeSubmenu(index) {
            const popup = getElement('menuSub');
            const stage = popup && popup.parentElement;
            const pills = getElement('menuPills') ? getElement('menuPills').children : [];
            const pill = pills[index];
            if (!popup || !stage || !pill) {
                return;
            }

            const stageBox = stage.getBoundingClientRect();
            const pillBox = pill.getBoundingClientRect();
            const half = Math.max(popup.offsetWidth / 2, 84);
            let left = pillBox.left - stageBox.left + pillBox.width / 2;
            left = Math.max(half + 4, Math.min(stageBox.width - half - 4, left));
            popup.style.left = left + 'px';
            popup.style.transform = 'translateX(-50%)';
        }

        function clickMenu(index) {
            const item = state.menu_draft.items[index];
            if (!item) {
                return;
            }
            menuIndex = index;

            if (item.type === 'switch') {
                // 开关只在预览里切换，用于查看开启/关闭两种外观。
                const id = (item.switch && item.switch.switch_id) || ('sw' + index);
                const hasPreviewSwitch = Object.prototype.hasOwnProperty.call(switchPreview, id);
                const current = hasPreviewSwitch ? switchPreview[id] : !!(item.switch && item.switch.default);
                switchPreview[id] = !current;
            } else if (item.type === 'menu') {
                expandedMenu = expandedMenu === index ? -1 : index;
            } else if (item.type === 'send_message') {
                getElement('menuComposer').textContent = item.send_message || '';
                expandedMenu = -1;
            } else if (item.type === 'link') {
                getElement('menuComposer').textContent = item.link || '';
                expandedMenu = -1;
            }
            render();
        }

        function clickSub(parentIndex, index) {
            const item = ((state.menu_draft && state.menu_draft.items) || [])[parentIndex];
            const sub = item && item.sub_menu_items ? item.sub_menu_items[index] : null;
            if (!sub) {
                return;
            }
            subIndex = index;
            if (sub.type === 'send_message') {
                getElement('menuComposer').textContent = sub.send_message || '';
            }
            if (sub.type === 'link') {
                getElement('menuComposer').textContent = sub.link || '';
            }
            render();
        }

        // ==================== 13. 草稿与平台操作 ====================
        // 每次保存或发送都会带上整份草稿，后端按 bot_hash 落盘。
        function draftBody() {
            return {
                bot_hash: botHash,
                menu_draft: state.menu_draft,
                panel_drafts: state.panel_drafts,
                unified_panel_mode: state.unified_panel_mode,
                chat_current_scope: scope,
                bot_enable_switch: state.bot_enable_switch,
            };
        }

        function showResult(data) {
            getElement('resultBox').textContent = JSON.stringify(data.api_result || data, null, 2);
        }

        function closeModal() {
            getElement('resultModal').hidden = true;
        }

        function showSendDialog(title, data) {
            const summary = (data && data.send_summary) || {success: 0, failed: 0, total: 0, items: []};
            getElement('modalTitle').textContent = title;
            getElement('modalSummary').innerHTML = '成功 <span class="ok">' + summary.success
                + '</span> 个，失败 <span class="fail">' + summary.failed + '</span> 个';

            getElement('modalList').innerHTML = (summary.items || []).map((item) => {
                const mark = item.ok ? '成功' : '失败';
                const detail = item.detail ? ' · ' + escapeHtml(String(item.detail)) : '';
                return '<div>' + escapeHtml(item.label || '请求') + '：' + mark + detail + '</div>';
            }).join('') || '<div>没有可统计的返回项</div>';

            getElement('resultModal').hidden = false;
            showResult(data);
        }

        // 只读刷新：读取本地草稿，不访问 QQ 平台。
        async function reloadState() {
            const data = await api('state', {bot_hash: botHash});
            state = data.data;
            if (!botHash && state.current_bot_hash) {
                botHash = state.current_bot_hash;
            }
            scope = state.chat_current_scope || scope;
            render();
        }

        // 完整刷新：先读草稿，再拉取平台当前配置。
        async function bootstrap() {
            getElement('resultBox').textContent = '正在读取本地草稿…';
            await reloadState();
            if (!botHash) {
                getElement('resultBox').textContent = '没有可管理的 qqGuildV2 Bot';
                return;
            }

            getElement('resultBox').textContent = '正在拉取平台当前配置…';
            try {
                const data = await api('bootstrap', {bot_hash: botHash});
                state = data.data;
                if (!botHash && state.current_bot_hash) {
                    botHash = state.current_bot_hash;
                }
                scope = state.chat_current_scope || scope;
                menuIndex = 0;
                panelIndex = 0;
                itemIndex = 0;
                render();
                const detail = data.data && data.data.api_result
                    ? JSON.stringify(data.data.api_result, null, 2)
                    : '';
                getElement('resultBox').textContent = (data.message || '已拉取') + (detail ? '\n' + detail : '');
            } catch (err) {
                // 平台拉取失败时仍保留本地草稿，方便继续编辑。
                getElement('resultBox').textContent = '拉取失败，已显示本地草稿：' + err.message;
            }
        }

        async function saveDraft() {
            const data = await api('draft', draftBody());
            state = data.data;
            getElement('resultBox').textContent = data.message;
            render();
        }

        async function pullMenu() {
            const data = await api('menu/pull', {bot_hash: botHash});
            state = data.data;
            menuIndex = 0;
            showResult(data.data);
            render();
        }

        async function sendMenu() {
            if (!await confirmAction('即将覆盖该机器人的全局自定义菜单，是否确认发送？')) {
                return;
            }
            const data = await api('menu/send', draftBody());
            state = data.data;
            showSendDialog('自定义菜单发送结果', data.data);
            render();
        }

        async function pullPanel(all) {
            const scopes = all ? ['all'] : [scope];
            const data = await api('panel/pull', {bot_hash: botHash, scopes: scopes});
            state = data.data;
            panelIndex = 0;
            showResult(data.data);
            render();
        }

        async function sendPanel() {
            if (!await confirmAction('即将提交当前指令面板到平台，是否确认发送？')) {
                return;
            }
            const body = Object.assign(draftBody(), {
                scope: scope,
                panel_index: panelIndex,
                unified_panel_mode: state.unified_panel_mode,
            });
            const data = await api('panel/send', body);
            state = data.data;
            showSendDialog('指令面板发送结果', data.data);
            render();
        }

        async function deleteRemote() {
            const panel = currentPanel();
            if (!panel || !panel.panel_id) {
                showNotice('没有 panel_id');
                return;
            }
            if (!await confirmAction('即将删除平台面板 ' + panel.panel_id + '，是否确认？')) {
                return;
            }
            const data = await api('panel/delete', {bot_hash: botHash, panel_id: panel.panel_id});
            state = data.data;
            showSendDialog('删除平台面板结果', data.data);
            render();
        }

        async function sendTarget(op) {
            if (!await confirmAction('即将对当前面板执行关联对象 ' + op + '，是否确认？')) {
                return;
            }
            const body = Object.assign(draftBody(), {scope: scope, panel_index: panelIndex, op: op});
            const data = await api('panel/target', body);
            state = data.data;
            showSendDialog('修改关联对象结果', data.data);
            render();
        }

        async function fillExample(kind) {
            const data = await api('example', {bot_hash: botHash, kind: kind, scope: scope});
            state = data.data;
            render();
        }

        async function saveGlobal() {
            // 三个开关与草稿分开保存：先存全局与 Bot 开关，再存一次草稿。
            const draft = Object.assign(draftBody(), {
                bot_enable_switch: getElement('botEnable').value === 'true',
            });
            const data = await api('global', {
                bot_hash: botHash,
                global_enable_switch: getElement('globalEnable').value === 'true',
                global_debug_mode_switch: getElement('globalDebug').value === 'true',
            });
            state = data.data;
            if (botHash) {
                const saved = await api('draft', draft);
                state = saved.data;
            }
            getElement('resultBox').textContent = data.message || '全局设置已保存';
            render();
        }

        async function addMaster() {
            const id = getElement('masterId').value.trim();
            if (!id) {
                return;
            }
            const data = await api('master', {bot_hash: botHash, op: 'add', master_id: id});
            state = data.data;
            getElement('masterId').value = '';
            render();
        }

        async function delMaster(id) {
            const data = await api('master', {bot_hash: botHash, op: 'del', master_id: id});
            state = data.data;
            render();
        }

        async function handleBotChange() {
            botHash = getElement('botSelect').value;
            await bootstrap();
        }

        // URL 参数 ?tab=settings 可以直接打开指定页签，便于从帮助文档跳转。
        function applyQueryTab() {
            const nextTab = new URLSearchParams(location.search).get('tab');
            if (nextTab) {
                showTab(nextTab);
            }
        }

        // ==================== 14. 事件绑定 ====================
        // 页面上所有按钮都在 HTML 里写好 data-action，这里集中登记对应处理函数。
        // 列表项是动态生成的，同样用 data-action，所以不需要逐个绑定。
        const ACTION_HANDLERS = {
            // 顶部工具栏
            'refresh': () => bootstrap(),
            // 页签
            'show-tab': (trigger) => showTab(trigger.dataset.tab),
            // 自定义菜单
            'add-menu': () => addMenu(),
            'delete-menu': () => delMenu(),
            'move-menu': (trigger) => moveMenu(Number(trigger.dataset.delta)),
            'fill-example': (trigger) => fillExample(trigger.dataset.kind),
            'select-menu': (trigger) => selectMenu(Number(trigger.dataset.index)),
            'select-sub': (trigger) => selectSub(Number(trigger.dataset.index)),
            'add-sub': () => addSub(),
            'delete-sub': () => delSub(),
            'pull-menu': () => pullMenu(),
            'save-draft': () => saveDraft(),
            'send-menu': () => sendMenu(),
            // 指令面板
            'add-panel': () => addPanel(),
            'delete-panel': () => delPanel(),
            'select-panel': (trigger) => selectPanel(Number(trigger.dataset.index)),
            'send-target': (trigger) => sendTarget(trigger.dataset.op),
            'add-item': () => addItem(),
            'delete-item': () => delItem(),
            'move-item': (trigger) => moveItem(Number(trigger.dataset.delta)),
            'select-item': (trigger) => selectItem(Number(trigger.dataset.index)),
            'pull-panel': (trigger) => pullPanel(trigger.dataset.scope === 'all'),
            'send-panel': () => sendPanel(),
            'delete-remote-panel': () => deleteRemote(),
            // 预览区
            'click-menu': (trigger) => clickMenu(Number(trigger.dataset.index)),
            'click-sub': (trigger) => clickSub(Number(trigger.dataset.parent), Number(trigger.dataset.index)),
            'change-scope': (trigger) => changeScope(trigger.dataset.scope),
            // 全局设置
            'save-global': () => saveGlobal(),
            'add-master': () => addMaster(),
            'delete-master': (trigger) => delMaster(trigger.dataset.id),
            // 弹窗
            'close-modal': () => closeModal(),
            'finish-confirm': (trigger) => finishConfirm(trigger.dataset.accepted === 'true'),
        };

        function handleActionClick(event) {
            const trigger = event.target.closest('[data-action]');
            if (!trigger) {
                return;
            }
            const handler = ACTION_HANDLERS[trigger.dataset.action];
            if (!handler) {
                return;
            }
            event.preventDefault();
            handler(trigger);
        }

        // 输入类控件数量固定，逐个绑定更直观；按钮与列表统一走上面的委托。
        function bindFieldEvents() {
            getElement('botSelect').addEventListener('change', handleBotChange);

            getElement('menuName').addEventListener('input', applyMenu);
            getElement('menuType').addEventListener('change', applyMenu);
            getElement('menuSend').addEventListener('input', applyMenu);
            getElement('menuLink').addEventListener('input', applyMenu);
            getElement('menuSwitchId').addEventListener('input', applyMenu);
            getElement('menuSwitchDefault').addEventListener('change', applyMenu);
            getElement('subName').addEventListener('input', applySub);
            getElement('subType').addEventListener('change', applySub);
            getElement('subSend').addEventListener('input', applySub);
            getElement('subLink').addEventListener('input', applySub);

            getElement('unified').addEventListener('change', onUnified);
            getElement('panelRemark').addEventListener('input', applyPanel);
            getElement('panelId').addEventListener('input', applyPanel);
            getElement('targetType').addEventListener('change', applyPanel);
            getElement('openidBox').addEventListener('input', applyPanel);
            getElement('itemName').addEventListener('input', applyItem);
            getElement('itemDesc').addEventListener('input', applyItem);
            getElement('itemType').addEventListener('change', applyItem);
            getElement('itemLink').addEventListener('input', applyItem);
            getElement('itemAdmin').addEventListener('change', applyItem);

            getElement('browseKey').addEventListener('input', renderBrowse);
        }

        // ==================== 15. 初始化 ====================
        function applyPageConfig() {
            document.title = PAGE_CONFIG.title;
            getElement('pageTitle').textContent = PAGE_CONFIG.title;
        }

        function initializePage() {
            applyPageConfig();
            bindFieldEvents();
            document.addEventListener('click', handleActionClick);
            // 先按配置显示页签，再拉取数据；render() 在 state 为空时会自行跳过。
            showTab(PAGE_CONFIG.defaultTab);

            if (window.__DEMO__) {
                // 离线预览模式：直接使用注入的假数据，不访问宿主。
                state = window.__DEMO__;
                botHash = state.current_bot_hash || '';
                scope = state.chat_current_scope || scope;
                render();
                applyQueryTab();
                return;
            }

            bootstrap()
                .then(applyQueryTab)
                .catch((err) => {
                    getElement('resultBox').textContent = err.message;
                });
        }

        initializePage();
    </script>
</body>
</html>
