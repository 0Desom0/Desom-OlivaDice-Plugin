'use strict';
const $ = id => document.getElementById(id);

const MESSAGE_LIMIT=301, CACHE_CHUNK=192*1024; let olderLoading=false, historyEnded=false, chatReady=false, switching=false;
async function saveChat(){if(!state.chat||!chatReady)return;if(olderLoading||state.uploading||state.sending)throw Error('当前操作尚未结束，请稍后切换');const current=ctx(),fields=['id','direction','platform_message_id','ref_idx','reply_to','sender_id','sender_name','msg_kind','content_text','content_json','created_at','keyword','recalled','_sending'],encoder=new TextEncoder(),buffer=new Uint8Array(CACHE_CHUNK);let used=0,index=0;async function flush(complete){let binary='';for(let p=0;p<used;p+=8192)binary+=String.fromCharCode(...buffer.subarray(p,Math.min(p+8192,used)));await api('CachePut',{...current,index:index++,data_b64:btoa(binary),complete});used=0}async function append(text){const bytes=encoder.encode(text);let offset=0;while(offset<bytes.length){if(used===buffer.length)await flush(false);const length=Math.min(buffer.length-used,bytes.length-offset);buffer.set(bytes.subarray(offset,offset+length),used);used+=length;offset+=length}}await append('{"messages":[');for(let i=0;i<state.messages.length;i++){const m=state.messages[i],entry=Object.fromEntries(fields.filter(k=>m[k]!==undefined).map(k=>[k,m[k]]));await append((i?',':'')+JSON.stringify(entry))}await append('],"members":'+JSON.stringify(state.members)+',"cursor":'+JSON.stringify(state.cursor)+',"changeCursor":'+JSON.stringify(state.changeCursor)+',"scrollTop":'+JSON.stringify($('messages').scrollTop)+',"historyEnded":'+JSON.stringify(historyEnded)+'}');await flush(true)}
async function cachedChat(current){const decoder=new TextDecoder('utf-8',{fatal:true}),parts=[];for(let index=0;;index++){const r=await api('CacheGet',{...current,index});if(!r.found)return null;const bytes=Uint8Array.from(atob(r.data_b64),c=>c.charCodeAt(0));parts.push(decoder.decode(bytes,{stream:!r.complete}));if(r.complete)return JSON.parse(parts.join(''))}}
const pending = new Map(); let seq=0; const session=Date.now().toString(36)+Math.random().toString(36).slice(2);

function api(action,payload={}){if(parent===window)return Promise.reject(Error('请从 OlivOS WebUI 插件页面打开控制台')); return new Promise((resolve,reject)=>{const id=session+'-'+(++seq), timer=setTimeout(()=>{pending.delete(id);reject(Error('请求超时，请核对操作结果'))},action==='JoinRequestList'?120000:30000); pending.set(id,{resolve,reject,timer}); parent.postMessage({type:'olivos:plugin_event',event:'QQOfficialConsole_'+action,request_id:id,payload},'*')})}
window.addEventListener('message',e=>{if(e.source!==parent||!e.data)return; const d=e.data;if(d.type==='olivos:plugin_visibility'){state.visible=d.visible!==false && !(d.payload && d.payload.visible===false); if(state.visible){poll();requestAnimationFrame(markVisibleRead)}return} if(d.type!=='olivos:plugin_reply')return;const p=pending.get(d.request_id);if(!p)return;pending.delete(d.request_id);clearTimeout(p.timer);if(d.error)return p.reject(Error(d.error));if(!d.payload||d.payload.ok!==true){const error=Error(d.payload?.keyword||d.payload?.message||'请求失败');error.payload=d.payload;p.reject(error);return}p.resolve(d.payload)});

function dialog(name){for(const url of $('dialogBody')._urls||[])URL.revokeObjectURL(url);$('dialogBody')._urls=[];$('dialogTitle').textContent=name;$('dialogBody').replaceChildren();$('overlay').hidden=false;return $('dialogBody')}

$('dialogClose').onclick=closeDialog;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDialog()};

function appendMessageImage(parent,url){const img=el('img',null,'message-image');img.alt='图片加载失败';img.loading='lazy';img.referrerPolicy='no-referrer';img.src=url;parent.append(img)}
const messageImageCache=new Map(),messageImagePending=new Map();
async function inboundImageBlob(context,messageId,attachment){const key=JSON.stringify([context.bot_hash,context.chat_type,context.chat_id,messageId,'in',attachment]);if(messageImageCache.has(key))return messageImageCache.get(key);if(messageImagePending.has(key))return messageImagePending.get(key);const task=(async()=>{const parts=[];let size=0,mime='',expected=0;for(let index=0;index<40;index++){const r=await api('AttachmentRead',{...context,message_id:messageId,attachment,index});if(!/^image\/(png|jpeg|gif|webp)$/.test(r.mime)||!Number.isSafeInteger(r.size)||r.size<=0||r.size>10*1024*1024||mime&&mime!==r.mime||expected&&expected!==r.size)throw Error('图片读取失败');mime=r.mime;expected=r.size;const bytes=Uint8Array.from(atob(r.data_b64),c=>c.charCodeAt(0));size+=bytes.length;if(!bytes.length||size>expected)throw Error('图片读取失败');parts.push(bytes);if(index+1===r.total_chunks){if(size!==expected)throw Error('图片读取失败');const blob=new Blob(parts,{type:mime});messageImageCache.set(key,blob);if(messageImageCache.size>20)messageImageCache.delete(messageImageCache.keys().next().value);return blob}}throw Error('图片读取失败')})();messageImagePending.set(key,task);try{return await task}finally{messageImagePending.delete(key)}}async function messageImageBlob(context,messageId,imageId){const key=JSON.stringify([context.bot_hash,context.chat_type,context.chat_id,messageId,imageId]);if(messageImageCache.has(key))return messageImageCache.get(key);if(messageImagePending.has(key))return messageImagePending.get(key);const task=(async()=>{const parts=[];let size=0,mime='',expected=0;for(let index=0;index<40;index++){const r=await api('MessageImageRead',{...context,message_id:messageId,image_id:imageId,index});if(!/^image\/(png|jpeg|gif|webp)$/.test(r.mime)||!Number.isSafeInteger(r.size)||r.size<=0||r.size>10*1024*1024||mime&&mime!==r.mime||expected&&expected!==r.size)throw Error('图片读取失败');mime=r.mime;expected=r.size;const bytes=Uint8Array.from(atob(r.data_b64),c=>c.charCodeAt(0));size+=bytes.length;if(!bytes.length||size>expected)throw Error('图片读取失败');parts.push(bytes);if(index+1===r.total_chunks){if(size!==expected)throw Error('图片读取失败');const blob=new Blob(parts,{type:mime});messageImageCache.set(key,blob);if(messageImageCache.size>20)messageImageCache.delete(messageImageCache.keys().next().value);return blob}}throw Error('图片读取失败')})();messageImagePending.set(key,task);try{return await task}finally{messageImagePending.delete(key)}}

function renderMessageContent(bubble,m){const data=content(m),stored=Array.isArray(data.images)?data.images:[],context=ctx(),used=new Set();let text=m.content_text||data.text||'';if(m.msg_kind==='markdown'&&stored.length){let last=0,match;const re=/\{\{(img_[A-Za-z0-9_]+)\}\}/g;while((match=re.exec(text))){const image=stored.find(x=>x.marker===match[1]);if(!image)continue;markdown(bubble,text.slice(last,match.index));appendStoredImage(bubble,m,image,context);used.add(image);last=re.lastIndex}markdown(bubble,text.slice(last))}else if(m.msg_kind==='markdown')markdown(bubble,text);else if(text&&!(text==='[图片]'&&stored.length))bubble.append(el('span',text));for(const image of stored)if(!used.has(image))appendStoredImage(bubble,m,image,context);const incoming=Array.isArray(data.attachments)?data.attachments:[];let count=0;incoming.forEach((item,i)=>{if(isIncomingImage(item)){appendInboundImage(bubble,m,i,context);count++}});if(!text&&!stored.length&&!count)bubble.append(el('span',m.msg_kind==='media'||data.has_image?'[图片]':'[消息]'))}

async function poll(){if(switching||state.sending||state.pulling||!state.visible||document.hidden||!state.bot)return;state.pulling=true;const current=ctx(),hasChat=!!state.chat&&chatReady;try{const requests=[api('ListChats',{bot_hash:state.bot})];if(hasChat)requests.push(api('PullMessages',{...current,after_id:state.cursor,limit:100,change_cursor:state.changeCursor}),api('PassiveStatus',current));requests.push(api('Bootstrap'));const results=await Promise.all(requests);if(switching||state.sending||current.bot_hash!==state.bot)return;renderBots(results[results.length-1].bots||[]);applyChats(results[0],current.bot_hash);if(hasChat&&sameChat(current)){const response=results[1],incoming=response.messages||[],box=$('messages'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80,oldTop=box.scrollTop,last=[...state.messages].reverse().find(x=>x.id>0);let changed=false,updates=response.changes||[];if(response.change_reset||state.changeCursor===null){const ids=state.messages.map(m=>m.id).filter(id=>id>0);if(ids.length){const snapshot=await api('PullMessages',{...current,snapshot_ids:ids});if(!sameChat(current)||switching||state.sending)return;updates=(snapshot.messages||[]).map(message=>({message}))}}for(const item of updates){const m=item.message,existing=state.messages.find(x=>x.id===m?.id);if(existing){Object.assign(existing,m);changed=true}}state.changeCursor=response.change_cursor??state.changeCursor;const known=new Set(state.messages.map(x=>x.id));if(!olderLoading&&(!last||last.id>=state.cursor))for(const m of incoming){if(known.has(m.id)){state.cursor=Math.max(state.cursor,Number(m.id)||0);continue}if(state.messages.length>=MESSAGE_LIMIT){if(!atBottom)break;state.messages.shift();historyEnded=false}state.messages.push(m);state.cursor=Math.max(state.cursor,Number(m.id)||0);changed=true}if(changed){renderMessages(atBottom);if(!atBottom)box.scrollTop=oldTop}const token=results[2].token;if(token){const seconds=Math.max(0,Math.floor(Number(token.expire_at)-Date.now()/1000));$('status').textContent=`被动 ${token.used_count||0}/${token.max_count||0} · 剩 ${Math.floor(seconds/60)}分${seconds%60}秒`}else $('status').textContent=state.chat.chat_type==='qq_group'?'将走主动（本群无可用被动）':'单聊流式优先'}}catch(e){if(!state._pollError){notice(e.message);state._pollError=true}}finally{state.pulling=false}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){poll();requestAnimationFrame(markVisibleRead)}});$('bots').onchange=async()=>{const next=$('bots').value,old=state.bot;if(switching){$('bots').value=old;return notice('正在切换会话，请稍候')}stopRequestPolling();switching=true;try{await saveChat();state.bot=next;state.chat=null;state.messages=[];state.cursor=0;chatReady=false;renderHeader();renderMessages(false);renderInfo();await api('SaveSettings',{settings:{last_bot_hash:state.bot},last_bot_hash:state.bot});await loadChats()}catch(e){$('bots').value=state.bot;error(e)}finally{switching=false;poll()}};
function revealEditor(){if(matchMedia('(max-width:900px)').matches&&document.activeElement===$('editor'))requestAnimationFrame(()=>$('send').scrollIntoView({block:'end',inline:'nearest',behavior:'auto'}))}
$('editor').addEventListener('focus',revealEditor);
if(window.visualViewport){const resize=()=>{document.documentElement.style.height=window.visualViewport.height+'px';$('app').style.height=window.visualViewport.height+'px';revealEditor()};window.visualViewport.addEventListener('resize',resize);resize()}
async function bootstrap(){try{const r=await api('Bootstrap');state.settings=r.settings||{};state.bot=state.settings.last_bot_hash||(r.bots||[])[0]?.hash||'';renderBots(r.bots||[]);if(state.bot&&!([...$('bots').options].some(o=>o.value===state.bot)))state.bot=$('bots').value;await loadChats();poll();state.timer=setInterval(poll,Math.max(1000,Number(state.settings.poll_interval_ms)||1000))}catch(e){error(e)}}
const jumpMention=button('@我',jumpToMention);jumpMention.id='jumpMention';jumpMention.title='跳转到最早未读的 @ 消息';jumpMention.hidden=true;$('showInfo').before(jumpMention);
bootstrap();
