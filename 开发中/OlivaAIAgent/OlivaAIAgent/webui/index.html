<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>OlivaAIAgent 设置</title>
    <script>
        'use strict';
        const PAGE_CONFIG = {
            eventName: 'OlivaAIAgent_WebUI_Config',
            title: 'OlivaAIAgent 设置',
            description: 'AI全能群聊插件统一设置中心：模型后端、视觉、语音、潜行、记忆与群覆盖。',
            requestTimeoutMs: 20000,
        };
    </script>
    <style>
        :root {
            color-scheme: light dark;
            --page-bg: #f4f6fa;
            --card-bg: #ffffff;
            --sidebar-bg: #f8fafc;
            --text-color: #1e293b;
            --muted-color: #64748b;
            --border-color: #cbd5e1;
            --accent-color: #0284c7;
            --accent-bg: #e0f2fe;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            --radius: 8px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --page-bg: #0f172a;
                --card-bg: #1e293b;
                --sidebar-bg: #141f33;
                --text-color: #f1f5f9;
                --muted-color: #94a3b8;
                --border-color: #334155;
                --accent-color: #38bdf8;
                --accent-bg: #082f49;
                --success-color: #4ade80;
                --error-color: #f87171;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--page-bg);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: 14px;
            line-height: 1.5;
        }
        .container {
            max-width: 1280px;
            margin: auto;
            padding: 20px;
        }
        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        h1 { margin: 0; font-size: 22px; font-weight: 700; }
        .subtitle { margin: 4px 0 0; color: var(--muted-color); font-size: 13px; }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .status-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            background: var(--accent-bg);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
        }
        .badge.ready { color: var(--success-color); }
        .badge.not-ready { color: var(--muted-color); }
        .nav-tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        .nav-tab {
            padding: 8px 18px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            border-radius: var(--radius) var(--radius) 0 0;
            color: var(--muted-color);
        }
        .nav-tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }
        .layout-two-col {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }
        @media (max-width: 768px) {
            .layout-two-col { grid-template-columns: 1fr; }
        }
        .sidebar {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .sidebar-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: inherit;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease;
        }
        .sidebar-item:hover { background: var(--accent-bg); }
        .sidebar-item.active {
            background: var(--accent-color);
            color: #ffffff;
            font-weight: 600;
        }
        .content-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
        }
        .section-header {
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .section-title { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
        .section-desc { color: var(--muted-color); font-size: 13px; white-space: pre-wrap; }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .form-label { font-weight: 500; font-size: 13px; }
        .form-hint {
            font-size: 12px;
            color: var(--muted-color);
            margin-top: 4px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        input, select, textarea, button { font: inherit; }
        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
            color: inherit;
            transition: border-color 0.15s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        textarea { resize: vertical; min-height: 80px; font-family: monospace; font-size: 13px; }
        .switch-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }
        button.btn {
            padding: 7px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
            color: inherit;
            cursor: pointer;
            font-weight: 500;
        }
        button.btn.primary {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }
        button.btn:hover:not(:disabled) { filter: brightness(1.08); }
        .status-msg {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 13px;
            display: none;
        }
        .status-msg.success { background: rgba(22, 163, 74, 0.15); color: var(--success-color); }
        .status-msg.error { background: rgba(220, 38, 38, 0.15); color: var(--error-color); }
        /* 群配置表格 */
        .group-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }
        .group-table th, .group-table td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            text-align: left;
        }
        .group-table th { background: var(--sidebar-bg); }
        .tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            background: var(--accent-bg);
        }
        .tag.on { background: rgba(22, 163, 74, 0.2); color: var(--success-color); }
        .tag.off { background: rgba(220, 38, 38, 0.2); color: var(--error-color); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>OlivaAIAgent 设置中心</h1>
                <div class="subtitle">管理全能群聊 AI 的 28 类全局配置、前置路由与分群覆盖</div>
            </div>
            <div class="header-actions">
                <button class="btn primary" onclick="saveAll()">保存并应用</button>
                <button class="btn" onclick="reloadFromDisk()">重新载入</button>
                <button class="btn" onclick="fetchState()">刷新数据</button>
            </div>
        </header>

        <div id="status-msg" class="status-msg"></div>

        <div id="status-badges" class="status-badges">
            <span id="badge-backend" class="badge">后端: 加载中...</span>
            <span id="badge-vision" class="badge">视觉: 加载中...</span>
            <span id="badge-media" class="badge">媒体: 加载中...</span>
            <span id="badge-voice" class="badge">语音: 加载中...</span>
        </div>

        <div class="nav-tabs">
            <button id="nav-tab-sections" class="nav-tab active" onclick="switchNav('sections')">全局分类设置</button>
            <button id="nav-tab-groups" class="nav-tab" onclick="switchNav('groups')">群级配置与覆盖</button>
        </div>

        <!-- 1. 全局分类设置面板 -->
        <section id="panel-sections">
            <div class="layout-two-col">
                <div class="sidebar">
                    <input type="text" id="section-search" placeholder="筛选分类..." style="margin-bottom: 8px;" oninput="filterSections()">
                    <div id="section-list"></div>
                </div>
                <div class="content-panel">
                    <div class="section-header">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h2 id="current-section-title" class="section-title">选择分类</h2>
                            <button class="btn" style="font-size: 12px; padding: 4px 10px;" onclick="resetCurrentSection()">恢复本类默认</button>
                        </div>
                        <div id="current-section-desc" class="section-desc"></div>
                    </div>
                    <div id="fields-container"></div>
                    <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                        <button class="btn primary" onclick="saveAll()">保存并应用修改</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 群级设置面板 -->
        <section id="panel-groups" style="display: none;">
            <div class="content-panel" style="margin-bottom: 16px;">
                <h2 class="section-title">全局群行为开关</h2>
                <div style="display: flex; gap: 20px; flex-wrap: wrap; margin: 14px 0;">
                    <label class="switch-label">
                        <input type="checkbox" id="grp-global-enable">
                        <span>插件全局启用</span>
                    </label>
                    <label class="switch-label">
                        <input type="checkbox" id="grp-whitelist">
                        <span>白名单模式</span>
                    </label>
                    <label class="switch-label">
                        <input type="checkbox" id="grp-default-enable">
                        <span>新群默认启用</span>
                    </label>
                    <label class="switch-label">
                        <input type="checkbox" id="grp-ambient-default">
                        <span>新群潜行默认启用</span>
                    </label>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px;">
                    <div class="form-group">
                        <label class="form-label">默认触发前缀 (JSON 数组)</label>
                        <textarea id="grp-default-prefixes" rows="2" placeholder='[".ai", "/ai"]'></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">默认触发关键词 (JSON 数组)</label>
                        <textarea id="grp-default-keywords" rows="2" placeholder='["小芙", "机器人"]'></textarea>
                    </div>
                </div>
                <button class="btn primary" onclick="saveGroupGlobals()">保存全局群设置</button>
            </div>

            <div class="content-panel">
                <h2 class="section-title">分群覆盖与管理</h2>
                <div class="form-hint" style="margin-bottom: 12px;">为特定平台与群号单独指定行为开关，未指定的群将继承全局默认值。</div>

                <!-- 添加/编辑群覆盖 -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: end; background: var(--sidebar-bg); padding: 12px; border-radius: 6px;">
                    <div>
                        <label class="form-label">平台标识</label>
                        <input type="text" id="add-grp-platform" placeholder="qq / qqGuild / *">
                    </div>
                    <div>
                        <label class="form-label">群号 / ID</label>
                        <input type="text" id="add-grp-id" placeholder="群号数字字符串">
                    </div>
                    <div>
                        <label class="form-label">插件启用</label>
                        <select id="add-grp-enable">
                            <option value="">继承默认</option>
                            <option value="true">开启</option>
                            <option value="false">关闭</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">潜行群友</label>
                        <select id="add-grp-ambient">
                            <option value="">继承默认</option>
                            <option value="true">开启</option>
                            <option value="false">关闭</option>
                        </select>
                    </div>
                    <button class="btn primary" onclick="saveGroupOverride()">保存群覆盖</button>
                </div>

                <table class="group-table" id="group-override-table">
                    <thead>
                        <tr>
                            <th>平台</th>
                            <th>群 ID</th>
                            <th>插件启用</th>
                            <th>潜行群友</th>
                            <th>高危工具</th>
                            <th>滚动摘要</th>
                            <th>长期事实</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="group-override-tbody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        'use strict';
        let currentState = null;
        let currentSchema = null;
        let currentSectionKey = 'general';
        let pendingRequests = new Map();
        let workingConf = {};

        window.addEventListener('message', (event) => {
            if (event.source !== window.parent) return;
            const data = event.data;
            if (!data) return;
            if (data.type === 'olivos:plugin_reply') {
                const resolver = pendingRequests.get(data.request_id);
                if (resolver) {
                    pendingRequests.delete(data.request_id);
                    resolver(data);
                }
            }
        });

        function sendEvent(payload) {
            return new Promise((resolve, reject) => {
                const requestId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
                const timer = setTimeout(() => {
                    pendingRequests.delete(requestId);
                    reject(new Error('请求超时，请检查 OlivOS 宿主连接或重载插件'));
                }, PAGE_CONFIG.requestTimeoutMs);

                pendingRequests.set(requestId, (reply) => {
                    clearTimeout(timer);
                    if (reply.error) {
                        reject(new Error(reply.error));
                    } else {
                        resolve(reply.payload);
                    }
                });

                window.parent.postMessage({
                    type: 'olivos:plugin_event',
                    event: PAGE_CONFIG.eventName,
                    request_id: requestId,
                    payload: payload,
                }, '*');
            });
        }

        function showStatus(text, isError = false) {
            const bar = document.getElementById('status-msg');
            bar.textContent = text;
            bar.className = isError ? 'status-msg error' : 'status-msg success';
            bar.style.display = 'block';
            setTimeout(() => { bar.style.display = 'none'; }, 4000);
        }

        function switchNav(nav) {
            document.getElementById('nav-tab-sections').className = nav === 'sections' ? 'nav-tab active' : 'nav-tab';
            document.getElementById('nav-tab-groups').className = nav === 'groups' ? 'nav-tab active' : 'nav-tab';
            document.getElementById('panel-sections').style.display = nav === 'sections' ? 'block' : 'none';
            document.getElementById('panel-groups').style.display = nav === 'groups' ? 'block' : 'none';
        }

        function getNested(root, path) {
            let node = root;
            for (const key of path) {
                if (node == null || typeof node !== 'object') return undefined;
                node = node[key];
            }
            return node;
        }

        function setNested(root, path, value) {
            let node = root;
            for (let i = 0; i < path.length - 1; i++) {
                const key = path[i];
                if (node[key] == null || typeof node[key] !== 'object') {
                    node[key] = {};
                }
                node = node[key];
            }
            node[path[path.length - 1]] = value;
        }

        async function fetchState() {
            try {
                const res = await sendEvent({ action: 'get_state' });
                if (res?.ok) {
                    currentState = res.state;
                    if (res.schema) currentSchema = res.schema;
                    workingConf = JSON.parse(JSON.stringify(currentState.conf || {}));
                    renderAll();
                } else {
                    showStatus(res?.error || '获取状态失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        function renderAll() {
            renderBadges();
            renderSidebar();
            renderSection(currentSectionKey);
            renderGroups();
        }

        function renderBadges() {
            const rs = currentState?.runtime_status || {};
            document.getElementById('badge-backend').textContent = `后端: ${rs.backend || '-'} | ${rs.model || '-'}`;
            document.getElementById('badge-vision').textContent = rs.vision_text || '视觉: -';
            document.getElementById('badge-vision').className = rs.vision_ready ? 'badge ready' : 'badge not-ready';
            document.getElementById('badge-media').textContent = rs.media_text || '媒体: -';
            document.getElementById('badge-voice').textContent = rs.voice_text || '语音: -';
            document.getElementById('badge-voice').className = rs.voice_ready ? 'badge ready' : 'badge not-ready';
        }

        function renderSidebar() {
            const list = document.getElementById('section-list');
            list.innerHTML = '';
            (currentState?.sections || []).forEach(s => {
                const btn = document.createElement('button');
                btn.className = s.id === currentSectionKey ? 'sidebar-item active' : 'sidebar-item';
                btn.textContent = s.label;
                btn.onclick = () => {
                    commitCurrentForm();
                    currentSectionKey = s.id;
                    renderSidebar();
                    renderSection(s.id);
                };
                list.appendChild(btn);
            });
        }

        function filterSections() {
            const q = document.getElementById('section-search').value.toLowerCase().trim();
            const items = document.querySelectorAll('.sidebar-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(q) ? 'block' : 'none';
            });
        }

        function renderSection(sectionKey) {
            const schema = currentSchema?.[sectionKey];
            const sectionMeta = (currentState?.sections || []).find(s => s.id === sectionKey);
            document.getElementById('current-section-title').textContent = sectionMeta?.label || sectionKey;
            document.getElementById('current-section-desc').textContent = schema?.description || '';

            const container = document.getElementById('fields-container');
            container.innerHTML = '';
            if (!schema || !schema.fields) return;

            schema.fields.forEach(f => {
                const group = document.createElement('div');
                group.className = 'form-group';

                const val = getNested(workingConf, f.path);
                const pathId = f.path.join('_');

                if (f.type === 'bool') {
                    group.innerHTML = `
                        <label class="switch-label">
                            <input type="checkbox" id="field_${pathId}" ${val ? 'checked' : ''} onchange="onFieldChange('${f.path.join('.')}', this.checked)">
                            <span class="form-label">${f.label}</span>
                        </label>
                        ${f.hint ? `<div class="form-hint">${f.hint}</div>` : ''}
                    `;
                } else if (f.type === 'enum') {
                    const opts = (f.enum_values || []).map(o => `<option value="${o}" ${String(val) === o ? 'selected' : ''}>${o}</option>`).join('');
                    group.innerHTML = `
                        <div class="form-label-row"><span class="form-label">${f.label}</span></div>
                        <select id="field_${pathId}" onchange="onFieldChange('${f.path.join('.')}', this.value)">${opts}</select>
                        ${f.hint ? `<div class="form-hint">${f.hint}</div>` : ''}
                    `;
                } else if (f.type === 'text') {
                    group.innerHTML = `
                        <div class="form-label-row"><span class="form-label">${f.label}</span></div>
                        <textarea id="field_${pathId}" rows="5" oninput="onFieldChange('${f.path.join('.')}', this.value)">${val != null ? val : ''}</textarea>
                        ${f.hint ? `<div class="form-hint">${f.hint}</div>` : ''}
                    `;
                } else if (f.type === 'json_list' || f.type === 'json_dict') {
                    const jsonStr = typeof val === 'object' ? JSON.stringify(val, null, 2) : (val || '');
                    group.innerHTML = `
                        <div class="form-label-row"><span class="form-label">${f.label}</span></div>
                        <textarea id="field_${pathId}" rows="4" onblur="onJsonFieldBlur('${f.path.join('.')}', this.value)">${jsonStr}</textarea>
                        ${f.hint ? `<div class="form-hint">${f.hint}</div>` : ''}
                    `;
                } else {
                    const inputType = f.is_secret ? 'password' : (f.type === 'int' || f.type === 'float' ? 'number' : 'text');
                    group.innerHTML = `
                        <div class="form-label-row"><span class="form-label">${f.label}</span></div>
                        <input type="${inputType}" id="field_${pathId}" value="${val != null ? val : ''}" oninput="onFieldChange('${f.path.join('.')}', this.value)">
                        ${f.hint ? `<div class="form-hint">${f.hint}</div>` : ''}
                    `;
                }
                container.appendChild(group);
            });
        }

        function onFieldChange(pathStr, rawValue) {
            const path = pathStr.split('.');
            setNested(workingConf, path, rawValue);
        }

        function onJsonFieldBlur(pathStr, rawValue) {
            const path = pathStr.split('.');
            try {
                const parsed = JSON.parse(rawValue || 'null');
                setNested(workingConf, path, parsed);
            } catch (err) {
                showStatus(`JSON 字段格式有误: ${err.message}`, true);
            }
        }

        function commitCurrentForm() {
            // 将当前 DOM 中的值刷入 workingConf
            const schema = currentSchema?.[currentSectionKey];
            if (!schema) return;
            schema.fields.forEach(f => {
                const pathId = f.path.join('_');
                const el = document.getElementById(`field_${pathId}`);
                if (!el) return;
                if (f.type === 'bool') {
                    setNested(workingConf, f.path, el.checked);
                } else if (f.type === 'int') {
                    setNested(workingConf, f.path, parseInt(el.value, 10) || 0);
                } else if (f.type === 'float') {
                    setNested(workingConf, f.path, parseFloat(el.value) || 0.0);
                } else if (f.type === 'json_list' || f.type === 'json_dict') {
                    try {
                        setNested(workingConf, f.path, JSON.parse(el.value || (f.type === 'json_list' ? '[]' : '{}')));
                    } catch (e) {}
                } else {
                    setNested(workingConf, f.path, el.value);
                }
            });
        }

        async function saveAll() {
            commitCurrentForm();
            try {
                const res = await sendEvent({ action: 'save_conf', conf: workingConf });
                if (res?.ok) {
                    showStatus('配置已保存并立即生效');
                    currentState = res.state;
                    workingConf = JSON.parse(JSON.stringify(currentState.conf || {}));
                    renderBadges();
                } else {
                    showStatus(res?.error || '保存失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function reloadFromDisk() {
            if (!confirm('重新从磁盘载入配置？尚未保存的修改将丢失。')) return;
            try {
                const res = await sendEvent({ action: 'reload_conf' });
                if (res?.ok) {
                    showStatus('已从磁盘重新载入');
                    currentState = res.state;
                    workingConf = JSON.parse(JSON.stringify(currentState.conf || {}));
                    renderAll();
                } else {
                    showStatus(res?.error || '重载失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function resetCurrentSection() {
            if (!confirm(`确定要将 [${currentSectionKey}] 恢复为默认值？`)) return;
            try {
                const res = await sendEvent({ action: 'reset_section', section: currentSectionKey });
                if (res?.ok) {
                    showStatus(`分类 [${currentSectionKey}] 已恢复默认`);
                    currentState = res.state;
                    workingConf = JSON.parse(JSON.stringify(currentState.conf || {}));
                    renderSection(currentSectionKey);
                } else {
                    showStatus(res?.error || '重置失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        // ==================== 群设置逻辑 ====================
        function renderGroups() {
            const conf = workingConf || {};
            document.getElementById('grp-global-enable').checked = !!conf.enable?.global;
            document.getElementById('grp-whitelist').checked = !!conf.whitelist?.enabled;
            document.getElementById('grp-default-enable').checked = !!conf.enable?.group_default;
            document.getElementById('grp-ambient-default').checked = !!conf.ambient?.enable_default;
            document.getElementById('grp-default-prefixes').value = JSON.stringify(conf.trigger?.prefix || [], null, 2);
            document.getElementById('grp-default-keywords').value = JSON.stringify(conf.trigger?.keywords || [], null, 2);

            const tbody = document.getElementById('group-override-tbody');
            tbody.innerHTML = '';
            const groups = currentState?.groups || {};

            Object.keys(groups).sort().forEach(platform => {
                const pGroups = groups[platform] || {};
                Object.keys(pGroups).sort().forEach(gid => {
                    const node = pGroups[gid] || {};
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${platform}</td>
                        <td>${gid}</td>
                        <td>${renderTag(node.enabled)}</td>
                        <td>${renderTag(node.ambient)}</td>
                        <td>${renderTag(node.admin_tools)}</td>
                        <td>${renderTag(node.memory_history)}</td>
                        <td>${renderTag(node.memory_long)}</td>
                        <td>
                            <button class="btn" style="padding: 2px 8px; font-size: 12px; color: var(--error-color);" onclick="deleteGroup('${platform}', '${gid}')">删除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        function renderTag(val) {
            if (val === true) return '<span class="tag on">开</span>';
            if (val === false) return '<span class="tag off">关</span>';
            return '<span class="tag">默认</span>';
        }

        async function saveGroupGlobals() {
            try {
                let prefixes = [];
                let keywords = [];
                try { prefixes = JSON.parse(document.getElementById('grp-default-prefixes').value || '[]'); } catch (e) { throw new Error('前缀 JSON 格式错误'); }
                try { keywords = JSON.parse(document.getElementById('grp-default-keywords').value || '[]'); } catch (e) { throw new Error('关键词 JSON 格式错误'); }

                const res = await sendEvent({
                    action: 'save_group_globals',
                    global: document.getElementById('grp-global-enable').checked,
                    whitelist: document.getElementById('grp-whitelist').checked,
                    group_default: document.getElementById('grp-default-enable').checked,
                    ambient_default: document.getElementById('grp-ambient-default').checked,
                    prefix: prefixes,
                    keywords: keywords,
                });
                if (res?.ok) {
                    showStatus('全局群设置已保存');
                    currentState = res.state;
                    workingConf = JSON.parse(JSON.stringify(currentState.conf || {}));
                    renderGroups();
                } else {
                    showStatus(res?.error || '保存失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function saveGroupOverride() {
            const platform = document.getElementById('add-grp-platform').value.trim();
            const gid = document.getElementById('add-grp-id').value.trim();
            if (!platform || !gid) {
                showStatus('平台和群 ID 不能为空', true);
                return;
            }
            const values = {};
            const enVal = document.getElementById('add-grp-enable').value;
            if (enVal !== '') values.enabled = enVal === 'true';
            const ambVal = document.getElementById('add-grp-ambient').value;
            if (ambVal !== '') values.ambient = ambVal === 'true';

            try {
                const res = await sendEvent({ action: 'save_group', platform: platform, group_id: gid, values: values });
                if (res?.ok) {
                    showStatus('群覆盖已保存');
                    currentState = res.state;
                    renderGroups();
                } else {
                    showStatus(res?.error || '保存群覆盖失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function deleteGroup(platform, gid) {
            if (!confirm(`确认删除 [${platform}:${gid}] 的群覆盖配置？`)) return;
            try {
                const res = await sendEvent({ action: 'delete_group', platform: platform, group_id: gid });
                if (res?.ok) {
                    showStatus('群覆盖已删除');
                    currentState = res.state;
                    renderGroups();
                } else {
                    showStatus(res?.error || '删除失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        fetchState();
    </script>
</body>
</html>
