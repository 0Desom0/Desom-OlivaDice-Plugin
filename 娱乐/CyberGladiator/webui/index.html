<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>赛博角斗场配置</title>
    <script>
        'use strict';
        const PAGE_CONFIG = {
            eventName: 'CyberGladiator_WebUI_Config',
            title: '赛博角斗场配置',
            description: '管理全局开关、模型接口、推演设定、骰主与自定义回复。',
            requestTimeoutMs: 15000,
            defaultTab: 'global',
            features: {
                replies: true,
                masters: true,
                directories: true,
            },
        };
    </script>
    <style>
        :root {
            color-scheme: light dark;
            --page-background: #f3f7fb;
            --card-background: #ffffff;
            --text-color: #203248;
            --muted-color: #596b80;
            --border-color: #d3deea;
            --accent-color: #0674aa;
            --accent-background: #e7f4fc;
            --error-color: #b33243;
            --font-family: system-ui, 'Microsoft YaHei', sans-serif;
            --font-size: 14px;
            --page-max-width: 1120px;
            --page-padding: 24px;
            --card-padding: 20px;
            --card-radius: 10px;
            --control-radius: 6px;
            --section-gap: 16px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --page-background: #141d28;
                --card-background: #1d2a39;
                --text-color: #e8f0f9;
                --muted-color: #a9bbce;
                --border-color: #415269;
                --accent-color: #7acbff;
                --accent-background: #233f54;
                --error-color: #ffabb5;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--page-background);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: 1.6;
        }
        main {
            max-width: var(--page-max-width);
            margin: auto;
            padding: var(--page-padding);
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        header > div { min-width: 0; }
        header > button { flex-shrink: 0; }
        h1 { margin: 0; font-size: 22px; }
        h2 { margin: 0 0 12px; font-size: 16px; }
        p { margin: 6px 0 14px; }
        .muted, .hint { color: var(--muted-color); }
        .hint { font-size: 12px; }
        .tabs {
            display: flex;
            gap: 8px;
            margin: 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .card {
            margin-bottom: var(--section-gap);
            padding: var(--card-padding);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            background: var(--card-background);
        }
        .columns {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
            gap: var(--section-gap);
        }
        @media (max-width: 860px) {
            .columns { grid-template-columns: 1fr; }
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }
        button, input, select, textarea { font: inherit; }
        button {
            padding: 7px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--control-radius);
            background: var(--card-background);
            color: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button:hover:not(:disabled) { border-color: var(--accent-color); }
        button.primary {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }
        button.primary:hover:not(:disabled) { filter: brightness(1.1); }
        button.tab-btn {
            border: none;
            background: transparent;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: var(--control-radius);
        }
        button.tab-btn.active {
            background: var(--accent-background);
            color: var(--accent-color);
        }
        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--control-radius);
            background: var(--card-background);
            color: inherit;
        }
        textarea { resize: vertical; min-height: 80px; }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .status-bar {
            margin: 12px 0;
            padding: 10px 14px;
            border-radius: var(--control-radius);
            background: var(--accent-background);
            color: var(--accent-color);
            font-size: 13px;
            display: none;
        }
        .status-bar.error {
            background: rgba(179, 50, 67, 0.15);
            color: var(--error-color);
        }
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            background: var(--accent-background);
            border-radius: 4px;
            font-size: 12px;
        }
        .tag button {
            padding: 0;
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <h1 id="page-title">赛博角斗场配置</h1>
                <p class="muted" id="page-desc">管理全局开关、模型接口、推演设定、骰主与自定义回复。</p>
            </div>
            <button id="btn-refresh" onclick="fetchState()">刷新数据</button>
        </header>

        <div id="status-bar" class="status-bar"></div>

        <div class="tabs">
            <button id="tab-btn-global" class="tab-btn active" onclick="switchTab('global')">全局设置</button>
            <button id="tab-btn-bot" class="tab-btn" onclick="switchTab('bot')">Bot 配置</button>
        </div>

        <!-- 全局设置页签 -->
        <section id="tab-global">
            <div class="card">
                <h2>全局功能开关</h2>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="g-enable-switch">
                        <span>插件全局启用 (global_enable_switch)</span>
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="g-debug-switch">
                        <span>调试模式 (global_debug_mode_switch) - 输出详细推演与通信日志</span>
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="g-god-war-switch">
                        <span>神战模式总开关 (global_god_war_enable_switch)</span>
                    </label>
                </div>
                <div class="row">
                    <button class="primary" onclick="saveGlobal()">保存全局设置</button>
                </div>
            </div>

            <div class="card" id="card-global-dir">
                <h2>数据存储目录</h2>
                <input type="text" id="g-data-dir" readonly onclick="this.select()">
                <div class="hint" style="margin-top: 6px;">全局配置与数据根路径</div>
            </div>
        </section>

        <!-- Bot 配置页签 -->
        <section id="tab-bot" style="display: none;">
            <div class="card">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;">
                    <h2>当前 Bot 选择</h2>
                    <select id="bot-selector" style="max-width: 320px;" onchange="onBotSelected()"></select>
                </div>
                <div id="linked-bot-hint" class="hint" style="margin-bottom: 14px;"></div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="b-enable-switch">
                        <strong>当前账号启用本插件 (bot_enable_switch)</strong>
                    </label>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>API 地址 (api_url)</label>
                        <input type="text" id="b-api-url" placeholder="https://api.siliconflow.cn/v1/chat/completions">
                    </div>
                    <div class="form-group">
                        <label>API Key (api_key)</label>
                        <input type="password" id="b-api-key" placeholder="sk-...">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>模型名称 (model)</label>
                        <input type="text" id="b-model" placeholder="deepseek-ai/DeepSeek-V3">
                    </div>
                    <div class="form-group">
                        <label>请求超时 (秒, request_timeout_seconds)</label>
                        <input type="number" id="b-timeout" min="5" max="3600">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>采样温度 (temperature, 0.0 - 2.0)</label>
                        <input type="number" id="b-temperature" step="0.05" min="0" max="2">
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label" style="margin-top: 26px;">
                            <input type="checkbox" id="b-forward-switch">
                            <span>启用 QQ 合并转发 (qq_forward_message_switch)</span>
                        </label>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>分段延迟最小秒数 (segment_delay_min_seconds)</label>
                        <input type="number" id="b-delay-min" min="0">
                    </div>
                    <div class="form-group">
                        <label>分段延迟最大秒数 (segment_delay_max_seconds)</label>
                        <input type="number" id="b-delay-max" min="0">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>普通模式输入字符上限 (normal_input_limit)</label>
                        <input type="number" id="b-input-limit" min="10" max="50000">
                    </div>
                    <div class="form-group">
                        <label>神战模式输入字符上限 (god_war_input_limit)</label>
                        <input type="number" id="b-god-war-limit" min="10" max="50000">
                    </div>
                </div>

                <div class="form-group">
                    <label>用户提示词前缀 (user_prompt_prefix)</label>
                    <input type="text" id="b-prompt-prefix" placeholder="可在此追加通用背景设定或额外限制">
                </div>

                <div class="form-group">
                    <label>普通模式系统提示词 (system_prompt)</label>
                    <textarea id="b-system-prompt" rows="6"></textarea>
                </div>

                <div class="form-group">
                    <label>神战模式系统提示词 (god_war_system_prompt)</label>
                    <textarea id="b-god-war-system-prompt" rows="6"></textarea>
                </div>

                <div class="row">
                    <button class="primary" onclick="saveBot()">保存 Bot 配置</button>
                </div>
            </div>

            <!-- 骰主与自定义回复 -->
            <div class="columns">
                <!-- 自定义回复词 -->
                <div class="card">
                    <h2>自定义回复词 (解析群链)</h2>
                    <div class="form-group">
                        <label>选择词条</label>
                        <select id="reply-key-selector" onchange="onReplySelected()"></select>
                    </div>
                    <div id="reply-note" class="hint" style="margin-bottom: 8px;"></div>
                    <div class="form-group">
                        <textarea id="reply-value" rows="4"></textarea>
                    </div>
                    <div class="row">
                        <button class="primary" onclick="saveReply()">保存词条</button>
                        <button onclick="resetReply()">恢复此条默认</button>
                        <button onclick="resetAllReplies()" style="color: var(--error-color);">恢复全部默认</button>
                    </div>
                </div>

                <!-- 骰主管理 -->
                <div class="card">
                    <h2>本插件配置骰主</h2>
                    <div class="hint">输入纯数字用户 ID，支持逗号或换行批量添加</div>
                    <div class="row" style="margin-top: 8px;">
                        <input type="text" id="master-input" placeholder="输入用户 ID">
                        <button class="primary" onclick="addMaster()">添加</button>
                    </div>
                    <div id="master-tags" class="tag-list"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        'use strict';
        let currentBotHash = '';
        let currentState = null;
        let pendingRequests = new Map();
        let isVisible = true;

        window.addEventListener('message', (event) => {
            if (event.source !== window.parent) return;
            const data = event.data;
            if (!data) return;
            if (data.type === 'olivos:plugin_visibility') {
                isVisible = data.visible;
                return;
            }
            if (data.type === 'olivos:plugin_reply') {
                const resolver = pendingRequests.get(data.request_id);
                if (resolver) {
                    pendingRequests.delete(data.request_id);
                    resolver(data);
                }
            }
        });

        function sendEvent(payload) {
            return new Promise((resolve, reject) => {
                const requestId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
                const timer = setTimeout(() => {
                    pendingRequests.delete(requestId);
                    reject(new Error('请求超时，请检查 OlivOS 宿主连接或重载插件'));
                }, PAGE_CONFIG.requestTimeoutMs);

                pendingRequests.set(requestId, (reply) => {
                    clearTimeout(timer);
                    if (reply.error) {
                        reject(new Error(reply.error));
                    } else {
                        resolve(reply.payload);
                    }
                });

                window.parent.postMessage({
                    type: 'olivos:plugin_event',
                    event: PAGE_CONFIG.eventName,
                    request_id: requestId,
                    payload: payload,
                }, '*');
            });
        }

        function showStatus(text, isError = false) {
            const bar = document.getElementById('status-bar');
            bar.textContent = text;
            bar.className = isError ? 'status-bar error' : 'status-bar';
            bar.style.display = 'block';
            setTimeout(() => { bar.style.display = 'none'; }, 4000);
        }

        function switchTab(tab) {
            document.getElementById('tab-btn-global').className = tab === 'global' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-btn-bot').className = tab === 'bot' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-global').style.display = tab === 'global' ? 'block' : 'none';
            document.getElementById('tab-bot').style.display = tab === 'bot' ? 'block' : 'none';
        }

        async function fetchState(requestedBotHash = currentBotHash) {
            try {
                const res = await sendEvent({ action: 'get_state', bot_hash: requestedBotHash });
                if (res && res.ok) {
                    renderState(res.state);
                } else {
                    showStatus(res?.error || '获取状态失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        function renderState(state) {
            currentState = state;
            // 全局
            const gc = state.global_config || {};
            document.getElementById('g-enable-switch').checked = !!gc.global_enable_switch;
            document.getElementById('g-debug-switch').checked = !!gc.global_debug_mode_switch;
            document.getElementById('g-god-war-switch').checked = !!gc.global_god_war_enable_switch;
            document.getElementById('g-data-dir').value = state.global_directory || '';

            // Bot 下拉框
            const selector = document.getElementById('bot-selector');
            selector.innerHTML = '';
            (state.bots || []).forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.hash;
                opt.textContent = b.label;
                selector.appendChild(opt);
            });

            if (state.bot) {
                currentBotHash = state.bot.hash;
                selector.value = state.bot.hash;
                renderBot(state.bot);
            } else {
                currentBotHash = '';
            }
        }

        function renderBot(bot) {
            document.getElementById('linked-bot-hint').textContent =
                bot.linked_hash && bot.linked_hash !== bot.hash
                    ? `已关联群链账号：${bot.linked_label}（回复词共用）`
                    : '独立账号（无群链关联）';

            document.getElementById('b-enable-switch').checked = !!bot.bot_enable_switch;
            document.getElementById('b-api-url').value = bot.api_url || '';
            document.getElementById('b-api-key').value = bot.api_key || '';
            document.getElementById('b-model').value = bot.model || '';
            document.getElementById('b-timeout').value = bot.request_timeout_seconds || 600;
            document.getElementById('b-temperature').value = bot.temperature ?? 0.9;
            document.getElementById('b-delay-min').value = bot.segment_delay_min_seconds ?? 10;
            document.getElementById('b-delay-max').value = bot.segment_delay_max_seconds ?? 20;
            document.getElementById('b-input-limit').value = bot.normal_input_limit ?? 1000;
            document.getElementById('b-god-war-limit').value = bot.god_war_input_limit ?? 1000;
            document.getElementById('b-forward-switch').checked = !!bot.qq_forward_message_switch;
            document.getElementById('b-prompt-prefix').value = bot.user_prompt_prefix || '';
            document.getElementById('b-system-prompt').value = bot.system_prompt || '';
            document.getElementById('b-god-war-system-prompt').value = bot.god_war_system_prompt || '';

            // 骰主
            const masterContainer = document.getElementById('master-tags');
            masterContainer.innerHTML = '';
            (bot.masters || []).forEach(m => {
                const tag = document.createElement('span');
                tag.className = 'tag';
                tag.innerHTML = `<span>${m}</span><button onclick="removeMaster('${m}')">&times;</button>`;
                masterContainer.appendChild(tag);
            });

            // 回复词
            const replySelector = document.getElementById('reply-key-selector');
            replySelector.innerHTML = '';
            (bot.replies || []).forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.key;
                opt.textContent = `${r.key}${r.is_default ? '' : ' *'}`;
                replySelector.appendChild(opt);
            });
            onReplySelected();
        }

        function onBotSelected() {
            const hash = document.getElementById('bot-selector').value;
            fetchState(hash);
        }

        function onReplySelected() {
            if (!currentState?.bot?.replies) return;
            const key = document.getElementById('reply-key-selector').value;
            const reply = currentState.bot.replies.find(r => r.key === key);
            if (reply) {
                document.getElementById('reply-note').textContent = reply.note || '';
                document.getElementById('reply-value').value = reply.value || '';
            }
        }

        async function saveGlobal() {
            try {
                const res = await sendEvent({
                    action: 'save_global',
                    global_enable_switch: document.getElementById('g-enable-switch').checked,
                    global_debug_mode_switch: document.getElementById('g-debug-switch').checked,
                    global_god_war_enable_switch: document.getElementById('g-god-war-switch').checked,
                });
                if (res?.ok) {
                    showStatus('全局设置保存成功');
                    renderState(res.state);
                } else {
                    showStatus(res?.error || '保存失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function saveBot() {
            if (!currentBotHash) return;
            try {
                const res = await sendEvent({
                    action: 'save_bot',
                    bot_hash: currentBotHash,
                    bot_enable_switch: document.getElementById('b-enable-switch').checked,
                    api_url: document.getElementById('b-api-url').value.trim(),
                    api_key: document.getElementById('b-api-key').value.trim(),
                    model: document.getElementById('b-model').value.trim(),
                    request_timeout_seconds: parseInt(document.getElementById('b-timeout').value, 10),
                    temperature: parseFloat(document.getElementById('b-temperature').value),
                    segment_delay_min_seconds: parseInt(document.getElementById('b-delay-min').value, 10),
                    segment_delay_max_seconds: parseInt(document.getElementById('b-delay-max').value, 10),
                    normal_input_limit: parseInt(document.getElementById('b-input-limit').value, 10),
                    god_war_input_limit: parseInt(document.getElementById('b-god-war-limit').value, 10),
                    qq_forward_message_switch: document.getElementById('b-forward-switch').checked,
                    user_prompt_prefix: document.getElementById('b-prompt-prefix').value,
                    system_prompt: document.getElementById('b-system-prompt').value,
                    god_war_system_prompt: document.getElementById('b-god-war-system-prompt').value,
                });
                if (res?.ok) {
                    showStatus('Bot 配置保存成功');
                    renderState(res.state);
                } else {
                    showStatus(res?.error || '保存失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function addMaster() {
            if (!currentBotHash) return;
            const input = document.getElementById('master-input');
            const ids = input.value.split(/[\s,，]+/).filter(x => /^\d{1,32}$/.test(x));
            if (!ids.length) {
                showStatus('请输入有效数字用户 ID', true);
                return;
            }
            try {
                const res = await sendEvent({ action: 'add_masters', bot_hash: currentBotHash, ids: ids });
                if (res?.ok) {
                    input.value = '';
                    showStatus('骰主添加成功');
                    renderState(res.state);
                } else {
                    showStatus(res?.error || '添加失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function removeMaster(id) {
            if (!currentBotHash) return;
            try {
                const res = await sendEvent({ action: 'remove_masters', bot_hash: currentBotHash, ids: [id] });
                if (res?.ok) {
                    showStatus('骰主移除成功');
                    renderState(res.state);
                } else {
                    showStatus(res?.error || '移除失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function saveReply() {
            if (!currentBotHash) return;
            const key = document.getElementById('reply-key-selector').value;
            const val = document.getElementById('reply-value').value;
            try {
                const res = await sendEvent({ action: 'save_reply', bot_hash: currentBotHash, key: key, value: val });
                if (res?.ok) {
                    showStatus(`回复词 [${key}] 保存成功`);
                    renderState(res.state);
                } else {
                    showStatus(res?.error || '保存回复词失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function resetReply() {
            if (!currentBotHash) return;
            const key = document.getElementById('reply-key-selector').value;
            if (!confirm(`确认恢复回复词 [${key}] 到默认值？`)) return;
            try {
                const res = await sendEvent({ action: 'reset_reply', bot_hash: currentBotHash, key: key, confirm: true });
                if (res?.ok) {
                    showStatus(`已恢复 [${key}] 为默认值`);
                    renderState(res.state);
                } else {
                    showStatus(res?.error || '恢复失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        async function resetAllReplies() {
            if (!currentBotHash) return;
            if (!confirm('确认恢复当前 Bot 的全部回复词到默认值？')) return;
            try {
                const res = await sendEvent({ action: 'reset_replies', bot_hash: currentBotHash, confirm: true });
                if (res?.ok) {
                    showStatus('已恢复全部默认回复');
                    renderState(res.state);
                } else {
                    showStatus(res?.error || '恢复失败', true);
                }
            } catch (err) {
                showStatus(err.message, true);
            }
        }

        // 页面初始化
        fetchState();
    </script>
</body>
</html>
