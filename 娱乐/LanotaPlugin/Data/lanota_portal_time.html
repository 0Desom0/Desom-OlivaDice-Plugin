<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Lanota · 曲目时长</title><style>/*__PAGE_STYLE__*/</style>
<style>
  main { padding: 18px 24px 14px; }
  .register { margin-top: 10px; }
  .track { grid-template-columns: 22px minmax(0,1fr) 50px; gap: 5px; padding: 2px 9px; }
  .track .title { display: inline; line-height: 22px; }
  .track .chapter { display: inline; margin-left: 7px; line-height: 22px; font-size: 13px; }
  .track .index { font-size: 14px; }
  footer { margin-top: 9px; }
  .two-col { columns: 2; column-gap: 12px; }
  .two-col .track { break-inside: avoid; page-break-inside: avoid; }
  .all-list .track { break-inside: avoid; }
</style></head>
<body>
<main>
  <header>
    <div><div class="kicker">LANOTA / PLAY TIME</div><h1 id="title">曲目时长</h1></div>
    <div class="metrics" id="summary"></div>
  </header>
  <div class="register pair" id="lists"></div>
  <div class="register" id="all"></div>
</main>
<script>/*__LANOTA_DATA__*/</script><script>/*__PAGE_SCRIPT__*/</script>
<script>
  const track = (row, index) => {
    const node = el('div', null, 'track');
    const detail = el('div');
    detail.append(song(row), chapter(row.chapter));
    node.append(el('span', String(index).padStart(2, '0'), 'index'), detail, el('span', row.duration, 'number'));
    return node;
  };
  if (data.mode === 'all') {
    byId('title').textContent = '全部曲目时长';
    byId('lists').hidden = true;
    const longCount = data.longCount || 0;
    const shortCount = data.shortCount || 0;
    byId('summary').append(metric(longCount, '长于 3 分钟'), metric(shortCount, '短于 2 分钟'),
      metric(data.average, '平均时长'));
    for (const [rows, label, accent, ascending] of [[data.long, '长于 3 分钟', 'gold', false],
                                                    [data.short, '短于 2 分钟', 'whisper', true]]) {
      const panel = el('section', null, 'panel');
      panel.style.setProperty('--accent', `var(--${accent})`);
      const head = el('div', null, 'section-head');
      head.append(el('h2', label), el('span', `共 ${rows.length} 首`, 'sub'));
      panel.append(head);
      const grid = el('div', null, 'two-col');
      rows.forEach((row, i) => grid.append(track(row, i + 1)));
      panel.append(grid);
      if (!rows.length) panel.append(el('p', '暂无符合时长的曲目', 'empty'));
      byId('all').append(panel);
    }
  } else {
    byId('summary').append(metric(data.total, '总曲数'), metric(data.long_count, '长曲'),
      metric(data.short_count, '短曲'), metric(data.average, '平均时长'));
    for (const [key, title, accent] of [['long', '长于 3 分钟', 'gold'], ['short', '短于 2 分钟', 'whisper']]) {
      const count = data[key + '_count'];
      const list = el('section', null, 'panel');
      list.style.setProperty('--accent', `var(--${accent})`);
      const head = el('div', null, 'section-head');
      head.append(el('h2', title), el('span', '共 ' + count + ' 首' + (count > 30 ? '，仅显示前 30' : ''), 'sub'));
      list.append(head);
      data[key].slice(0, 30).forEach((row, i) => list.append(track(row, i + 1)));
      if (!count) list.append(el('p', '暂无符合时长的曲目', 'empty'));
      byId('lists').append(list);
    }
  }
  fitPage();
</script>
</body></html>
