<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Lanota · 谱面物量榜</title><style>/*__PAGE_STYLE__*/</style>
<style>
  main { padding: 18px 24px 14px; }
  .register { margin-top: 10px; }
  .rank-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 18px; }
  .rank-list .track { grid-template-columns: 30px minmax(0,1fr) auto 62px; gap: 6px; padding: 2px 12px; }
  .rank-list .title { display: inline; line-height: 22px; }
  .rank-list .chapter { display: inline; margin-left: 7px; font-size: 13px; }
  .rank-list .badge { font-size: 14px; }
  .rank-list .number { font-size: 16px; }
  .rank-list .index { font-size: 14px; }
  .rank-list tbody tr:nth-child(-n+3) .index,
  .rank-list .track:nth-child(-n+3) .index { font-weight: 700; color: var(--gold); }
  footer { margin-top: 9px; }
</style></head>
<body style="--accent:var(--whisper)">
<main>
  <header>
    <div><div class="kicker">LANOTA / NOTE RANKING</div><h1>谱面物量榜</h1></div>
    <div class="metrics" id="summary"></div>
  </header>
  <section class="register panel">
    <div class="section-head"><h2>物量最高的前 50 张谱面</h2>
      <span class="sub">名次 · 曲名（ID）· 难度标级 · 物量 · 章节</span></div>
    <div class="rank-list" id="ranking"></div>
  </section>
  <footer id="footer"></footer>
</main>
<script>/*__LANOTA_DATA__*/</script><script>/*__PAGE_SCRIPT__*/</script>
<script>
  const rows = data.rows.slice(0, 50);
  byId('summary').append(metric(rows.length, '谱面'), metric(rows.length ? rows[0].notes : '—', '最高物量'));
  rows.forEach((row, i) => {
    const node = el('div', null, 'track');
    const detail = el('div');
    detail.append(song(row), chapter(row.chapter));
    node.append(el('span', String(i + 1).padStart(2, '0'), 'index'), detail,
      difficulty(row), el('span', String(row.notes), 'number'));
    byId('ranking').append(node);
  });
  byId('footer').textContent = `物量排行 · 共列出 ${rows.length} 张谱面`;
  fitPage();
</script>
</body></html>
