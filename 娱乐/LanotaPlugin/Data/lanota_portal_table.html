<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Lanota · 谱面定数表</title><style>/*__PAGE_STYLE__*/</style>
<style>
  main { padding: 16px 22px 12px; }
  .tier { margin-top: 10px; break-inside: avoid; page-break-inside: avoid; }
  .tier:first-child { margin-top: 0; }
  .tier-head { display: flex; align-items: baseline; gap: 10px; padding: 5px 13px; border-radius: 10px;
               border: 1px solid var(--line); border-left: 5px solid var(--accent);
               background: linear-gradient(96deg,#332844 0%,#20192f 64%); }
  .tier-head b { font-size: 22px; line-height: 1.15; color: var(--accent);
                 font-family: Kawoszeh,'Segoe UI',sans-serif; font-variant-numeric: tabular-nums; }
  .tier-head span { color: var(--muted); font-size: 13px; }
  .rows { margin-top: 5px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
  .trow { display: flex; align-items: baseline; gap: 8px; padding: 2px 11px; }
  .trow + .trow { border-top: 1px solid #ffffff10; }
  .trow .idx { flex: none; width: 22px; color: var(--muted); font-size: 13px;
               font-family: Kawoszeh,'Segoe UI',sans-serif; font-variant-numeric: tabular-nums; }
  .trow .const { flex: none; width: 62px; color: var(--gold); font-weight: 700; font-size: 15px;
                 font-family: Kawoszeh,'Segoe UI',sans-serif; }
  .trow .name { flex: 0 1 auto; overflow-wrap: anywhere; line-height: 20px; }
  .trow .sid { flex: none; margin-left: 5px; color: var(--muted); font-size: 12px; }
  .trow .badge { flex: none; margin-left: auto; padding-left: 9px; font-size: 13px; white-space: nowrap; }
  .columns { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; align-items: start; }
  .range-chip { margin-right: 14px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px;
                color: var(--gold); font-size: 12px; letter-spacing: .04em; }
</style></head>
<body style="--accent:var(--master)">
<main>
  <header>
    <div><div class="kicker">LANOTA / CHART CONSTANTS</div><h1 id="title">谱面定数表</h1></div>
    <div class="metrics" id="summary"></div>
  </header>
  <div id="tiers"></div>
</main>
<script>/*__LANOTA_DATA__*/</script><script>/*__PAGE_SCRIPT__*/</script>
<script>
  const constantMode = data.groupBy !== 'level';
  const tiers = (data.tiers && data.tiers.length)
    ? data.tiers : [{level: data.level, rows: data.rows, count: data.rows.length}];
  const columnCount = data.rows.length > 80 ? 3 : (data.rows.length > 40 ? 2 : 1);
  byId('title').textContent = (constantMode ? '谱面定数表 · ' : '谱面定数表 · 标级 ') + (data.span || data.level);
  byId('summary').append(metric(tiers.length, constantMode ? '定数档' : '标级'),
    metric(data.rows.length, '谱面'));
  if (tiers.length > 1) {
    const chip = el('span', '区间 ' + tiers[0].level + ' → ' + tiers[tiers.length - 1].level, 'range-chip');
    byId('summary').prepend(chip);
  }

  const renderTier = tier => {
    const wrap = el('div', null, 'tier');
    const head = el('div', null, 'tier-head');
    head.append(el('b', (constantMode ? '定数 ' : '标级 ') + tier.level), el('span', '共 ' + tier.count + ' 张'));
    wrap.append(head);
    const box = el('div', null, 'rows');
    tier.rows.forEach((row, i) => {
      const line = el('div', null, 'trow');
      line.append(el('span', String(i + 1).padStart(2, '0'), 'idx'));
      if (!constantMode) line.append(el('span', String(row.constant), 'const'));
      const name = el('span', row.name, 'name');
      name.append(el('span', '#' + row.id, 'sid'));
      line.append(name, difficulty(row));
      box.append(line);
    });
    wrap.append(box);
    return wrap;
  };

  const holder = byId('tiers');
  if (columnCount > 1) {
    // 每档高度 ≈ 行数 × 26 + 档头 46；在档位边界上穷举切分点，
    // 让最高的那一栏尽量矮（档位仍然整档不拆）。
    const heights = tiers.map(tier => tier.count * 26 + 46);
    const total = heights.reduce((sum, value) => sum + value, 0);
    const cum = [];
    let running = 0;
    for (const height of heights) { running += height; cum.push(running); }
    const columnHeight = cuts => {
      let previous = 0;
      let tallest = 0;
      for (const cut of [...cuts, tiers.length]) {
        tallest = Math.max(tallest, cum[cut - 1] - previous);
        previous = cum[cut - 1];
      }
      return tallest;
    };
    let bestCuts = [];
    if (columnCount === 2) {
      for (let a = 1; a < tiers.length; a += 1) {
        if (!bestCuts.length || columnHeight([a]) < columnHeight(bestCuts)) bestCuts = [a];
      }
    } else {
      let bestScore = Infinity;
      for (let a = 1; a < tiers.length - 1; a += 1) {
        for (let b = a + 1; b < tiers.length; b += 1) {
          const score = columnHeight([a, b]);
          if (score < bestScore) { bestScore = score; bestCuts = [a, b]; }
        }
      }
    }
    const bounds = [0, ...bestCuts, tiers.length];
    const columns = el('div', null, 'columns');
    columns.style.gridTemplateColumns = `repeat(${columnCount}, minmax(0,1fr))`;
    for (let i = 0; i < bounds.length - 1; i += 1) {
      const column = el('div');
      tiers.slice(bounds[i], bounds[i + 1]).forEach(tier => column.append(renderTier(tier)));
      columns.append(column);
    }
    holder.append(columns);
  } else {
    tiers.forEach(tier => holder.append(renderTier(tier)));
  }
  fitPage();
</script>
</body></html>
